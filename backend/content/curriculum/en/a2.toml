# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "en.a2.past_simple"
title = "Thì quá khứ đơn: việc đã xảy ra"
pattern = "chủ ngữ + động từ -ed / dạng quá khứ bất quy tắc"
explanation = "Dùng để kể việc đã xong trong quá khứ, thường đi với yesterday, last week, ago. Động từ có quy tắc thêm -ed (worked, played); nhiều động từ hay dùng có dạng riêng phải nhớ (go → went, see → saw)."
examples = [
  { text = "I visited my grandmother last weekend.", translation = "Cuối tuần trước tôi đã đến thăm bà." },
  { text = "We went to the beach two years ago.", translation = "Hai năm trước chúng tôi đã đi biển." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "65"

[[grammar]]
key = "en.a2.past_did"
title = "Câu hỏi và phủ định quá khứ với did"
pattern = "Did + chủ ngữ + động từ nguyên mẫu …? / chủ ngữ + didn't + động từ nguyên mẫu"
forms = ["did", "didn't", "did not"]
explanation = "Ở quá khứ đơn, câu hỏi và câu phủ định dùng did. Khi đã có did thì động từ chính trở về nguyên mẫu: Did you go? (không nói Did you went?)."
examples = [
  { text = "Did you see the match last night?", translation = "Tối qua bạn có xem trận đấu không?" },
  { text = "She didn't call me yesterday.", translation = "Hôm qua cô ấy không gọi cho tôi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "65-2"

[[grammar]]
key = "en.a2.was_were"
title = "Was / were: quá khứ của to be"
pattern = "I/he/she/it + was / you/we/they + were (+ not)"
forms = ["was", "were", "wasn't", "weren't"]
explanation = "Was và were là quá khứ của am, is, are. Dùng was với I, he, she, it; were với you, we, they. Phủ định thêm not: wasn't, weren't."
examples = [
  { text = "The weather was terrible yesterday.", translation = "Hôm qua thời tiết rất tệ." },
  { text = "We weren't at home last night.", translation = "Tối qua chúng tôi không ở nhà." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "64-1"

[[grammar]]
key = "en.a2.past_progressive"
title = "Quá khứ tiếp diễn: đang làm gì lúc đó"
pattern = "was/were + động từ -ing"
forms = ["was", "were", "wasn't", "weren't"]
explanation = "Diễn tả việc đang diễn ra tại một thời điểm trong quá khứ, hay dùng làm nền cho một việc khác chen vào: I was cooking when you called."
examples = [
  { text = "I was watching TV at nine o'clock.", translation = "Lúc chín giờ tôi đang xem TV." },
  { text = "They were walking home when it started to rain.", translation = "Họ đang đi bộ về nhà thì trời bắt đầu mưa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "66"

[[grammar]]
key = "en.a2.present_perfect"
title = "Hiện tại hoàn thành: đã từng, vừa mới"
pattern = "have/has + quá khứ phân từ"
forms = ["have", "has", "'ve", "'s", "haven't", "hasn't"]
explanation = "Nối quá khứ với hiện tại: kinh nghiệm (đã từng), việc vừa xong còn ảnh hưởng bây giờ, hoặc việc kéo dài tới nay. Không nói thời điểm cụ thể; hay đi với ever, never, already, yet, just."
examples = [
  { text = "Have you ever been to Japan?", translation = "Bạn đã bao giờ đến Nhật chưa?" },
  { text = "I've just finished my homework.", translation = "Tôi vừa làm xong bài tập về nhà." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "62"

[[grammar]]
key = "en.a2.will_future"
title = "Will: tương lai, quyết định ngay, lời hứa"
pattern = "will ('ll) / won't + động từ nguyên mẫu"
forms = ["will", "'ll", "won't", "will not"]
explanation = "Dùng will để đoán tương lai, quyết định ngay lúc nói, hứa hoặc đề nghị giúp. Khi nói thường rút gọn: I'll, she'll; phủ định là won't."
examples = [
  { text = "I think it will rain tomorrow.", translation = "Tôi nghĩ mai trời sẽ mưa." },
  { text = "Don't worry, I'll help you.", translation = "Đừng lo, tôi sẽ giúp bạn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "69"

[[grammar]]
key = "en.a2.going_to"
title = "Be going to: dự định, sắp xảy ra"
pattern = "am/is/are + going to + động từ nguyên mẫu"
forms = ["going to", "gonna"]
explanation = "Dùng cho việc đã định trước khi nói, hoặc việc thấy rõ sắp xảy ra. Khi nói nhanh, going to thường nghe như gonna."
examples = [
  { text = "We're going to visit Da Nang next month.", translation = "Tháng sau chúng tôi định đi Đà Nẵng." },
  { text = "Look at those clouds. It's going to rain.", translation = "Nhìn mây kìa. Trời sắp mưa rồi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "122"

[[grammar]]
key = "en.a2.have_to"
title = "Have to: phải (do hoàn cảnh)"
pattern = "have/has/had to + động từ nguyên mẫu"
forms = ["have to", "has to", "had to", "have got to"]
explanation = "Nói việc bắt buộc do quy định hay hoàn cảnh bên ngoài. Quá khứ là had to. Don't have to nghĩa là không cần, khác với mustn't (không được)."
examples = [
  { text = "I have to get up early tomorrow.", translation = "Ngày mai tôi phải dậy sớm." },
  { text = "You don't have to pay for the tickets.", translation = "Bạn không cần trả tiền vé." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "127"

[[grammar]]
key = "en.a2.must"
title = "Must / mustn't: phải, không được"
pattern = "must / mustn't + động từ nguyên mẫu"
forms = ["must", "mustn't", "must not"]
explanation = "Must diễn tả việc người nói thấy cần thiết hoặc quy tắc mạnh. Mustn't là cấm, không được làm."
examples = [
  { text = "You must wear a helmet.", translation = "Bạn phải đội mũ bảo hiểm." },
  { text = "You mustn't smoke here.", translation = "Bạn không được hút thuốc ở đây." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "135-1"

[[grammar]]
key = "en.a2.might"
title = "Might: có lẽ, có thể sẽ"
pattern = "might (not) + động từ nguyên mẫu"
forms = ["might", "mightn't", "might not"]
explanation = "Dùng khi chưa chắc chắn, khả năng khoảng một nửa: có lẽ, có thể. Phủ định might not nghĩa là có lẽ không."
examples = [
  { text = "I might go to the party tonight.", translation = "Tối nay có lẽ tôi sẽ đi dự tiệc." },
  { text = "Take an umbrella. It might rain.", translation = "Mang ô đi. Có thể trời sẽ mưa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "132-2"

[[grammar]]
key = "en.a2.should"
title = "Should: nên"
pattern = "should / shouldn't + động từ nguyên mẫu"
forms = ["should", "shouldn't", "should not"]
explanation = "Dùng để khuyên hoặc nói điều đúng đắn nên làm. Shouldn't là không nên."
examples = [
  { text = "You should drink more water.", translation = "Bạn nên uống nhiều nước hơn." },
  { text = "We shouldn't stay up so late.", translation = "Chúng ta không nên thức khuya như vậy." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "139"

[[grammar]]
key = "en.a2.would_like"
title = "Would like / would: mong muốn lịch sự"
pattern = "would ('d) like + danh từ / to + động từ"
forms = ["would", "'d", "wouldn't"]
explanation = "I'd like … là cách nói muốn một cách lịch sự, hay dùng khi gọi món hay nhờ vả. Would cũng dùng để nói điều tưởng tượng: I would buy a house."
examples = [
  { text = "I'd like a cup of coffee, please.", translation = "Cho tôi một tách cà phê." },
  { text = "Would you like to come with us?", translation = "Bạn có muốn đi cùng chúng tôi không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "142"

[[grammar]]
key = "en.a2.need_to"
title = "Need to: cần làm gì"
pattern = "need(s) to + động từ nguyên mẫu / don't need to"
forms = ["need", "needs", "needed"]
explanation = "Need to nói việc cần làm. Don't need to nghĩa là không cần, giống don't have to."
examples = [
  { text = "I need to buy some milk.", translation = "Tôi cần mua ít sữa." },
  { text = "You don't need to bring anything.", translation = "Bạn không cần mang gì cả." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "136"

[[grammar]]
key = "en.a2.comparative_more"
title = "So sánh hơn với more"
pattern = "more + tính từ dài + than"
forms = ["more", "less"]
explanation = "Tính từ có hai âm tiết trở lên (expensive, interesting) không thêm -er mà dùng more phía trước; sau đó là than + vật được so sánh."
examples = [
  { text = "This phone is more expensive than that one.", translation = "Điện thoại này đắt hơn cái kia." },
  { text = "English is more interesting than I thought.", translation = "Tiếng Anh thú vị hơn tôi nghĩ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "39"

[[grammar]]
key = "en.a2.superlative_most"
title = "So sánh nhất với the most"
pattern = "the most + tính từ dài (+ in/of …)"
forms = ["most", "least"]
explanation = "Với tính từ dài, nói \"nhất\" bằng the most + tính từ. Thường kèm in + nơi chốn hoặc of + nhóm."
examples = [
  { text = "It's the most beautiful city in Vietnam.", translation = "Đó là thành phố đẹp nhất Việt Nam." },
  { text = "This is the most difficult question.", translation = "Đây là câu hỏi khó nhất." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "41"

[[grammar]]
key = "en.a2.much_many"
title = "Much và many: nhiều"
pattern = "much + danh từ không đếm được / many + danh từ số nhiều"
forms = ["much", "many", "how much", "how many"]
explanation = "Much đi với danh từ không đếm được (water, time, money), many đi với danh từ đếm được số nhiều (books, people). Hay dùng trong câu hỏi How much / How many và câu phủ định."
examples = [
  { text = "How much money do you have?", translation = "Bạn có bao nhiêu tiền?" },
  { text = "There aren't many people here today.", translation = "Hôm nay ở đây không có nhiều người." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "18"

[[grammar]]
key = "en.a2.another"
title = "Another: thêm một, một cái khác"
pattern = "another + danh từ số ít"
forms = ["another"]
explanation = "Another nghĩa là thêm một nữa hoặc một cái khác, luôn đi với danh từ số ít."
examples = [
  { text = "Can I have another cup of tea?", translation = "Cho tôi thêm một tách trà nữa được không?" },
  { text = "Let's try another restaurant.", translation = "Mình thử một nhà hàng khác đi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "17"

[[grammar]]
key = "en.a2.one_ones"
title = "One / ones: thay cho danh từ đã nói"
pattern = "the + tính từ + one/ones"
forms = ["one", "ones"]
explanation = "Để khỏi lặp lại danh từ, dùng one (số ít) hoặc ones (số nhiều): I like the red one."
examples = [
  { text = "I don't like this shirt. I prefer the blue one.", translation = "Tôi không thích áo này. Tôi thích cái màu xanh hơn." },
  { text = "These shoes are old. I need new ones.", translation = "Đôi giày này cũ rồi. Tôi cần đôi mới." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "25"

[[grammar]]
key = "en.a2.this_that_noun"
title = "This / that + danh từ"
pattern = "this/that + danh từ số ít, these/those + danh từ số nhiều"
forms = ["this", "that", "these", "those"]
explanation = "Đặt this, that ngay trước danh từ để chỉ rõ vật nào: this book (quyển sách này), that house (ngôi nhà kia)."
examples = [
  { text = "This coffee is too sweet.", translation = "Cà phê này ngọt quá." },
  { text = "Who is that man over there?", translation = "Người đàn ông đằng kia là ai?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "11"

[[grammar]]
key = "en.a2.phrasal_verb_object"
title = "Cụm động từ có tân ngữ ở giữa: turn it off"
pattern = "động từ + tân ngữ + tiểu từ (turn the TV off / turn it off)"
explanation = "Nhiều cụm động từ như turn off, put on, pick up cho phép đặt tân ngữ ở giữa. Khi tân ngữ là đại từ (it, them) thì bắt buộc đặt ở giữa: turn it off, không nói turn off it."
examples = [
  { text = "Please turn the light off.", translation = "Làm ơn tắt đèn đi." },
  { text = "I'll pick you up at seven.", translation = "Tôi sẽ đón bạn lúc bảy giờ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "56"

[[grammar]]
key = "en.a2.passive_past"
title = "Bị động quá khứ: was/were + V3"
pattern = "was/were + quá khứ phân từ (+ by …)"
forms = ["was", "were", "wasn't", "weren't"]
explanation = "Dùng khi quan tâm đến sự việc hay vật chịu tác động hơn là người làm. Muốn nói ai làm thì thêm by."
examples = [
  { text = "This bridge was built in 1990.", translation = "Cây cầu này được xây năm 1990." },
  { text = "The letters were sent yesterday.", translation = "Những lá thư đã được gửi hôm qua." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "76"

[[grammar]]
key = "en.a2.verb_object_ing"
title = "Động từ + người/vật + V-ing"
pattern = "see/hear/find/mind + tân ngữ + động từ -ing"
explanation = "Sau một số động từ, tân ngữ đi kèm động từ thêm -ing để nói người hay vật đó đang làm gì: I saw him running."
examples = [
  { text = "I saw a man waiting outside.", translation = "Tôi thấy một người đàn ông đang đợi bên ngoài." },
  { text = "Do you mind me opening the window?", translation = "Bạn có phiền nếu tôi mở cửa sổ không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "114"

[[grammar]]
key = "en.a2.verb_that_clause"
title = "Động từ + that + mệnh đề"
pattern = "think/know/say/hope + that + câu"
forms = ["that"]
explanation = "That nối một động từ chỉ suy nghĩ hay lời nói với cả một câu phía sau: I know that you are busy. Khi nói, that thường bị lược đi."
examples = [
  { text = "I hope that you feel better soon.", translation = "Tôi mong bạn sớm khỏe lại." },
  { text = "She said that the shop was closed.", translation = "Cô ấy nói rằng cửa hàng đã đóng cửa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "152"

[[grammar]]
key = "en.a2.if_clause"
title = "If: nếu (điều có thể xảy ra)"
pattern = "If + hiện tại đơn, … will/can/hiện tại"
forms = ["if"]
explanation = "If mở đầu một điều kiện có thật hoặc có thể xảy ra. Vế if dùng hiện tại đơn dù nói về tương lai: If it rains, we'll stay home."
examples = [
  { text = "If you are tired, you can go home.", translation = "Nếu bạn mệt, bạn có thể về nhà." },
  { text = "If it rains tomorrow, we'll stay at home.", translation = "Nếu mai trời mưa, chúng tôi sẽ ở nhà." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "156"

[[grammar]]
key = "en.a2.as_clause"
title = "As: vì, khi"
pattern = "As + mệnh đề, …"
forms = ["as"]
explanation = "As nối hai vế câu, thường nghĩa là \"vì\" (lý do người nghe đã biết) hoặc \"khi, trong lúc\"."
examples = [
  { text = "As it was late, we took a taxi.", translation = "Vì đã muộn nên chúng tôi đi taxi." },
  { text = "She smiled as she opened the door.", translation = "Cô ấy mỉm cười khi mở cửa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "157"

[[grammar]]
key = "en.a2.it_adjective_to"
title = "It is + tính từ + to V"
pattern = "It is (+ for ai) + tính từ + to + động từ"
forms = ["it", "it's"]
explanation = "Dùng it làm chủ ngữ tạm để nhận xét về một việc: It is easy to learn (học thì dễ). Muốn nói với ai thì thêm for + người."
examples = [
  { text = "It's important to sleep well.", translation = "Ngủ ngon rất quan trọng." },
  { text = "It was difficult for me to find a job.", translation = "Tôi đã rất khó khăn mới tìm được việc." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "163"

[[grammar]]
key = "en.a2.linking_verbs"
title = "Look, feel, sound, get + tính từ"
pattern = "chủ ngữ + look/feel/sound/seem/get/become + tính từ"
forms = ["look", "looks", "looked", "feel", "feels", "felt", "sound", "sounds", "sounded", "seem", "seems", "seemed", "get", "gets", "got", "become", "becomes", "became", "go", "goes", "went"]
explanation = "Những động từ này nối chủ ngữ với một tính từ mô tả trạng thái hay cảm nhận: You look tired (trông bạn mệt). Sau chúng dùng tính từ, không dùng trạng từ."
examples = [
  { text = "You look tired today.", translation = "Hôm nay trông bạn mệt mỏi." },
  { text = "That sounds great!", translation = "Nghe tuyệt quá!" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "195"

[[grammar]]
key = "en.a2.reported_say"
title = "Thuật lại lời nói với say"
pattern = "chủ ngữ + said (that) + câu lùi thì"
forms = ["say", "says", "said", "explain", "explained", "report", "reported"]
explanation = "Khi kể lại lời người khác, dùng said (that) và thường lùi thì một bậc: \"I am busy\" → He said he was busy."
examples = [
  { text = "He said he was busy.", translation = "Anh ấy nói anh ấy bận." },
  { text = "The teacher explained that the test was easy.", translation = "Cô giáo giải thích rằng bài kiểm tra dễ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "200"

[[grammar]]
key = "en.a2.indirect_question"
title = "Câu hỏi gián tiếp: I don't know where …"
pattern = "know/understand/wonder + từ hỏi + chủ ngữ + động từ"
forms = ["know", "knew", "understand", "wonder", "wondered", "decide", "decided", "explain", "explained", "learn", "see"]
explanation = "Khi câu hỏi nằm trong một câu khác, giữ trật tự câu kể (chủ ngữ trước động từ): I don't know where he lives, không nói where does he live."
examples = [
  { text = "I don't know where she lives.", translation = "Tôi không biết cô ấy sống ở đâu." },
  { text = "I wonder what time it is.", translation = "Tôi tự hỏi bây giờ là mấy giờ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "202"

[[grammar]]
key = "en.a2.make_let_have"
title = "Make / let / have + người + động từ"
pattern = "make/let/have + tân ngữ + động từ nguyên mẫu (không to)"
forms = ["make", "makes", "made", "let", "lets", "have", "has", "had"]
explanation = "Make ai làm gì là bắt buộc, let ai làm gì là cho phép, have ai làm gì là nhờ hoặc giao việc. Động từ sau không có to."
examples = [
  { text = "My mum made me clean my room.", translation = "Mẹ bắt tôi dọn phòng." },
  { text = "Let me help you.", translation = "Để tôi giúp bạn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "206"

[[grammar]]
key = "en.a2.which_question"
title = "Hỏi lựa chọn với Which"
pattern = "Which (+ danh từ) + …?"
forms = ["which"]
explanation = "Which nghĩa là \"cái nào, người nào\", dùng khi chọn trong một số lựa chọn đã biết."
examples = [
  { text = "Which bus goes to the airport?", translation = "Xe buýt nào đi sân bay?" },
  { text = "Which do you prefer, tea or coffee?", translation = "Bạn thích cái nào hơn, trà hay cà phê?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "241"

[[grammar]]
key = "en.a2.can_you_request"
title = "Nhờ vả: Can you …? / Would you …?"
pattern = "Can you / Could you / Would you + động từ …?"
forms = ["can you", "could you", "would you"]
explanation = "Câu hỏi này thực ra là lời nhờ. Would you và Could you lịch sự hơn Can you; thêm please cho mềm hơn."
examples = [
  { text = "Can you open the door, please?", translation = "Bạn mở cửa giúp tôi được không?" },
  { text = "Would you help me with this bag?", translation = "Bạn giúp tôi xách cái túi này nhé?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "249"

[[grammar]]
key = "en.a2.relative_what"
title = "What = điều mà"
pattern = "động từ + what + chủ ngữ + động từ"
forms = ["what"]
explanation = "What có thể có nghĩa \"điều mà, cái mà\" và nối với một vế câu: I understand what you mean."
examples = [
  { text = "I understand what you mean.", translation = "Tôi hiểu điều bạn muốn nói." },
  { text = "Tell me what you want for dinner.", translation = "Cho tôi biết bạn muốn ăn gì tối nay." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "183"

[[grammar]]
key = "en.a2.relative_where_when"
title = "Where / when nối với danh từ: the place where …"
pattern = "danh từ nơi chốn + where …, danh từ thời gian + when …"
forms = ["where", "when"]
explanation = "Where và when có thể nối một danh từ với một vế câu bổ nghĩa: the town where I was born (thị trấn nơi tôi sinh ra), the day when we met."
examples = [
  { text = "This is the house where I grew up.", translation = "Đây là ngôi nhà nơi tôi lớn lên." },
  { text = "I remember the day when we met.", translation = "Tôi nhớ cái ngày chúng ta gặp nhau." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "185"

[[grammar]]
key = "en.a2.suggestions"
title = "Rủ rê, gợi ý: How about …? / Why don't we …?"
pattern = "How about + V-ing/danh từ? / Why don't we + động từ? / Shall we + động từ?"
forms = ["how about", "what about", "why don't we", "why don't you", "why not", "shall we", "shall i"]
explanation = "Những câu hỏi này dùng để rủ hoặc gợi ý, không phải để hỏi thông tin. Sau How about dùng V-ing hoặc danh từ; sau Why don't we và Shall we dùng động từ nguyên mẫu."
examples = [
  { text = "How about going to the cinema tonight?", translation = "Tối nay đi xem phim thì sao?" },
  { text = "Why don't we take a taxi?", translation = "Sao mình không đi taxi nhỉ?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "262"

[[grammar]]
key = "en.a2.whose_question"
title = "Hỏi chủ sở hữu với Whose"
pattern = "Whose (+ danh từ) + is/are + …?"
forms = ["whose"]
explanation = "Whose nghĩa là \"của ai\". Có thể đứng một mình hoặc đi kèm danh từ: Whose bag is this?"
examples = [
  { text = "Whose phone is ringing?", translation = "Điện thoại của ai đang reo vậy?" },
  { text = "Whose are these keys?", translation = "Mấy chiếc chìa khóa này của ai?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "244"

