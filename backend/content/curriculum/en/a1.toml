# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "en.be_present"
title = "Động từ to be: am / is / are"
pattern = "I am … / You are … / He/She is …"
forms = ["am", "is", "are", "'m", "'re", "'s"]
explanation = "To be nghĩa là \"là\" hoặc \"ở\". Dùng am với I, is với he, she, it và một người hay vật, are với you, we, they. Khi nói thường rút gọn: I'm, you're, she's."
examples = [
  { text = "I am Lan.", translation = "Tôi là Lan." },
  { text = "She is my friend.", translation = "Cô ấy là bạn của tôi." },
  { text = "We are happy.", translation = "Chúng tôi vui." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "58"

[[grammar]]
key = "en.possessive_adjectives"
title = "Từ chỉ sở hữu: my, your, his, her"
pattern = "my / your / his / her / our / their + danh từ"
forms = ["my", "your", "his", "her", "its", "our", "their"]
explanation = "Đặt trước danh từ để nói vật hay người đó thuộc về ai: my (của tôi), your (của bạn), his (của anh ấy), her (của cô ấy). Không thêm \"the\" phía trước."
examples = [
  { text = "My name is Minh.", translation = "Tên tôi là Minh." },
  { text = "What is your name?", translation = "Tên bạn là gì?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "6"

[[grammar]]
key = "en.where_question"
title = "Hỏi nơi chốn với Where"
pattern = "Where + be/do + chủ ngữ …?"
forms = ["where"]
explanation = "Where nghĩa là \"ở đâu\". Đặt Where ở đầu câu, rồi đến be hoặc do, rồi chủ ngữ. Câu hỏi quen thuộc nhất là Where are you from? (Bạn đến từ đâu?)."
examples = [
  { text = "Where are you from?", translation = "Bạn đến từ đâu?" },
  { text = "Where do you live?", translation = "Bạn sống ở đâu?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "245"

[[grammar]]
key = "en.be_questions"
title = "Câu hỏi có/không với to be"
pattern = "Am I / Are you / Is he … ?"
forms = ["am", "is", "are"]
explanation = "Muốn hỏi có/không, đưa am, is, are lên trước chủ ngữ. Trả lời ngắn: Yes, I am. / No, I'm not."
examples = [
  { text = "Are you a student?", translation = "Bạn là học sinh phải không?" },
  { text = "Is she from Hanoi?", translation = "Cô ấy đến từ Hà Nội phải không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "58-2"

[[grammar]]
key = "en.this_that"
title = "This is / That is"
pattern = "This is … / That is …"
forms = ["this", "that"]
explanation = "This dùng cho người hoặc vật ở gần, that cho người hoặc vật ở xa. This is … rất hay dùng để giới thiệu người khác."
examples = [
  { text = "This is my mother.", translation = "Đây là mẹ tôi." },
  { text = "That is my house.", translation = "Kia là nhà tôi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "8"

[[grammar]]
key = "en.articles_a_an"
title = "Mạo từ a / an"
pattern = "a + phụ âm / an + nguyên âm"
forms = ["a", "an"]
explanation = "A hoặc an đứng trước một danh từ số ít đếm được, nghĩa là \"một\". Dùng an khi từ sau bắt đầu bằng âm nguyên âm (a, e, i, o, u): an apple, an hour."
examples = [
  { text = "I have a brother.", translation = "Tôi có một anh trai." },
  { text = "She is an only child.", translation = "Cô ấy là con một." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "13"

[[grammar]]
key = "en.how_old"
title = "Hỏi tuổi với How old"
pattern = "How old + be + chủ ngữ? — chủ ngữ + be + số (years old)."
forms = ["how old"]
explanation = "How old nghĩa là \"bao nhiêu tuổi\". Trả lời bằng số tuổi, có thể thêm years old ở cuối."
examples = [
  { text = "How old are you?", translation = "Bạn bao nhiêu tuổi?" },
  { text = "I am twenty years old.", translation = "Tôi hai mươi tuổi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "247"

[[grammar]]
key = "en.present_simple"
title = "Thì hiện tại đơn: việc thường làm"
pattern = "I/You/We/They + động từ nguyên mẫu"
explanation = "Dùng để nói thói quen hoặc việc lặp lại hằng ngày. Với I, you, we, they giữ nguyên động từ: I work, they eat."
examples = [
  { text = "I get up at six.", translation = "Tôi dậy lúc sáu giờ." },
  { text = "We eat breakfast at home.", translation = "Chúng tôi ăn sáng ở nhà." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "59"

[[grammar]]
key = "en.frequency_adverbs"
title = "Trạng từ tần suất: always, usually, sometimes"
pattern = "chủ ngữ + always/usually/often/sometimes + động từ"
forms = ["always", "usually", "often", "sometimes", "never"]
explanation = "Cho biết bạn làm việc gì thường xuyên đến mức nào: always (luôn luôn), usually (thường), often (hay), sometimes (thỉnh thoảng). Đặt trước động từ chính."
examples = [
  { text = "I usually go to work early.", translation = "Tôi thường đi làm sớm." },
  { text = "She sometimes eats lunch late.", translation = "Thỉnh thoảng cô ấy ăn trưa muộn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "32"

[[grammar]]
key = "en.do_questions"
title = "Câu hỏi với Do"
pattern = "Do + you/they + động từ …? — Yes, I do. / No, I don't."
forms = ["do", "does"]
explanation = "Với thì hiện tại đơn, muốn hỏi có/không thì thêm Do ở đầu câu và giữ nguyên động từ. Trả lời ngắn bằng do hoặc don't."
examples = [
  { text = "Do you like coffee?", translation = "Bạn có thích cà phê không?" },
  { text = "Do they eat rice every day?", translation = "Họ có ăn cơm mỗi ngày không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "59-2"

[[grammar]]
key = "en.like_ing"
title = "Like + V-ing: thích làm gì"
pattern = "like + động từ thêm -ing"
forms = ["like", "likes"]
explanation = "Sau like (thích) có thể dùng một danh từ, hoặc một động từ thêm -ing để nói thích làm việc gì."
examples = [
  { text = "I like drinking tea.", translation = "Tôi thích uống trà." },
  { text = "He likes cooking.", translation = "Anh ấy thích nấu ăn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "112"

[[grammar]]
key = "en.there_is_are"
title = "There is / There are"
pattern = "There is + danh từ số ít / There are + danh từ số nhiều"
forms = ["there"]
explanation = "Dùng để nói ở đâu đó \"có\" cái gì. There is cho một thứ, there are cho nhiều thứ."
examples = [
  { text = "There is a bed in my room.", translation = "Trong phòng tôi có một cái giường." },
  { text = "There are two chairs in the kitchen.", translation = "Trong bếp có hai cái ghế." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "146"

[[grammar]]
key = "en.place_prepositions"
title = "Giới từ chỉ nơi chốn: in, on, under, next to"
pattern = "in / on / under / next to + nơi chốn"
forms = ["in", "on", "under", "next to", "behind", "between"]
explanation = "In là ở trong, on là ở trên (chạm mặt), under là ở dưới, next to là ở cạnh. Đặt trước danh từ chỉ nơi chốn."
examples = [
  { text = "The book is on the table.", translation = "Quyển sách ở trên bàn." },
  { text = "The garden is next to the house.", translation = "Khu vườn ở cạnh ngôi nhà." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "21"

[[grammar]]
key = "en.when_question"
title = "Hỏi thời gian với When / What time"
pattern = "When/What time + do/does + chủ ngữ + động từ?"
forms = ["when", "what time"]
explanation = "When nghĩa là \"khi nào\", What time nghĩa là \"mấy giờ\". Trả lời với at + giờ (at seven) hoặc on + thứ (on Monday)."
examples = [
  { text = "What time do you get up?", translation = "Bạn dậy lúc mấy giờ?" },
  { text = "When is your birthday?", translation = "Sinh nhật bạn khi nào?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "236"

[[grammar]]
key = "en.present_simple_third_person"
title = "Hiện tại đơn với he / she: thêm -s"
pattern = "He/She/It + động từ thêm -s/-es"
explanation = "Khi chủ ngữ là he, she, it hoặc một người, động từ thêm -s (works, plays) hoặc -es (watches, goes). Đây là lỗi người mới học hay quên."
examples = [
  { text = "She works on Monday.", translation = "Cô ấy làm việc vào thứ Hai." },
  { text = "He watches TV every evening.", translation = "Anh ấy xem tivi mỗi tối." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "60"

[[grammar]]
key = "en.these_those"
title = "These / Those"
pattern = "These are … / Those are …"
forms = ["these", "those"]
explanation = "These là số nhiều của this (những cái này, ở gần), those là số nhiều của that (những cái kia, ở xa). Đi với are."
examples = [
  { text = "These shoes are expensive.", translation = "Đôi giày này đắt." },
  { text = "Those shirts are nice.", translation = "Mấy cái áo kia đẹp." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "9"

[[grammar]]
key = "en.can_i"
title = "Xin phép, nhờ vả với Can I …?"
pattern = "Can I + động từ …?"
forms = ["can i"]
explanation = "Can I …? dùng để xin phép hoặc nhờ một cách lịch sự, rất hay gặp khi đi mua sắm. Thêm please cho lịch sự hơn."
examples = [
  { text = "Can I pay by card?", translation = "Tôi trả bằng thẻ được không?" },
  { text = "Can I see that dress, please?", translation = "Cho tôi xem chiếc váy kia được không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "253"

[[grammar]]
key = "en.can_ability"
title = "Can: có thể, biết làm gì"
pattern = "chủ ngữ + can / can't + động từ nguyên mẫu"
forms = ["can", "can't", "cannot"]
explanation = "Can nói về khả năng: biết hoặc có thể làm gì. Động từ sau can giữ nguyên, không thêm -s. Phủ định là can't."
examples = [
  { text = "I can swim.", translation = "Tôi biết bơi." },
  { text = "She can't play football.", translation = "Cô ấy không biết đá bóng." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "123"

[[grammar]]
key = "en.lets"
title = "Let's: rủ cùng làm"
pattern = "Let's + động từ nguyên mẫu"
forms = ["let's", "let us"]
explanation = "Let's (= let us) dùng để rủ người khác cùng làm một việc, giống \"Mình cùng … nhé\"."
examples = [
  { text = "Let's watch a film.", translation = "Mình cùng xem phim nhé." },
  { text = "Let's play football this weekend.", translation = "Cuối tuần này mình đá bóng nhé." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "120"

[[grammar]]
key = "en.object_pronouns"
title = "Đại từ tân ngữ: me, him, her, us, them"
pattern = "động từ/giới từ + me / you / him / her / it / us / them"
forms = ["me", "him", "her", "us", "them"]
explanation = "Sau động từ hoặc giới từ, dùng me, him, her, us, them thay cho I, he, she, we, they: She likes me (không nói She likes I)."
examples = [
  { text = "Can you help me?", translation = "Bạn giúp tôi được không?" },
  { text = "I see them every day.", translation = "Ngày nào tôi cũng gặp họ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "7"

[[grammar]]
key = "en.present_progressive"
title = "Thì hiện tại tiếp diễn: đang làm gì"
pattern = "am/is/are + động từ -ing"
forms = ["am", "is", "are", "'m", "'re", "'s"]
explanation = "Dùng để nói việc đang diễn ra ngay lúc nói: I am cooking (tôi đang nấu ăn). Hỏi thì đưa am, is, are lên trước: What are you doing?"
examples = [
  { text = "I'm watching TV now.", translation = "Bây giờ tôi đang xem TV." },
  { text = "What are you doing?", translation = "Bạn đang làm gì vậy?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "61"

[[grammar]]
key = "en.comparative_er"
title = "So sánh hơn với -er: bigger, older"
pattern = "tính từ ngắn + -er + than"
forms = ["than"]
explanation = "Với tính từ ngắn, thêm -er để nói \"hơn\", rồi dùng than trước vật được so sánh: My brother is taller than me. Một số từ đặc biệt: good → better, bad → worse."
examples = [
  { text = "My brother is taller than me.", translation = "Anh tôi cao hơn tôi." },
  { text = "Today is colder than yesterday.", translation = "Hôm nay lạnh hơn hôm qua." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "38"

[[grammar]]
key = "en.superlative_est"
title = "So sánh nhất với -est: the biggest"
pattern = "the + tính từ ngắn + -est"
forms = ["the"]
explanation = "Với tính từ ngắn, nói \"nhất\" bằng the + tính từ thêm -est: the tallest (cao nhất). Từ đặc biệt: good → the best, bad → the worst."
examples = [
  { text = "She is the youngest in my family.", translation = "Cô ấy nhỏ tuổi nhất nhà tôi." },
  { text = "This is the best cake in town.", translation = "Đây là cái bánh ngon nhất thị trấn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "40"

[[grammar]]
key = "en.what_why_how"
title = "Câu hỏi với What, Why, How"
pattern = "What / Why / How + be/do + chủ ngữ …?"
forms = ["what", "why", "how"]
explanation = "What hỏi cái gì, Why hỏi tại sao (trả lời bằng Because …), How hỏi thế nào. Đặt từ hỏi ở đầu câu, rồi đến be hoặc do, rồi chủ ngữ."
examples = [
  { text = "What is your phone number?", translation = "Số điện thoại của bạn là gì?" },
  { text = "Why are you sad? — Because I'm tired.", translation = "Sao bạn buồn? — Vì tôi mệt." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "239"

