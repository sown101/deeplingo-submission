# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "en.b1.possessive_pronouns"
title = "Đại từ sở hữu: mine, yours, hers"
pattern = "mine / yours / his / hers / ours / theirs"
forms = ["mine", "yours", "his", "hers", "ours", "theirs"]
explanation = "Đại từ sở hữu đứng một mình, thay cho \"của ai + danh từ\": This bag is mine = This is my bag. Không thêm danh từ phía sau."
examples = [
  { text = "Is this phone yours?", translation = "Điện thoại này của bạn à?" },
  { text = "Our flat is smaller than theirs.", translation = "Căn hộ của chúng tôi nhỏ hơn của họ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "22"

[[grammar]]
key = "en.b1.reflexive_pronouns"
title = "Đại từ phản thân: myself, yourself"
pattern = "myself / yourself / himself / herself / itself / ourselves / themselves"
forms = ["myself", "yourself", "himself", "herself", "itself", "ourselves", "yourselves", "themselves"]
explanation = "Dùng khi người làm và người chịu tác động là một (I hurt myself), hoặc để nhấn mạnh tự mình làm (I made it myself). By myself nghĩa là một mình."
examples = [
  { text = "Be careful, don't cut yourself.", translation = "Cẩn thận, đừng để bị đứt tay." },
  { text = "She built the website herself.", translation = "Cô ấy tự làm trang web." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "23"

[[grammar]]
key = "en.b1.each_other"
title = "Each other: nhau"
pattern = "động từ + each other / one another"
forms = ["each other", "one another"]
explanation = "Each other nghĩa là \"nhau\": hai bên cùng làm việc đó với nhau. Khác với themselves (mỗi người tự làm với chính mình)."
examples = [
  { text = "We have known each other for ten years.", translation = "Chúng tôi quen nhau đã mười năm." },
  { text = "They don't talk to each other any more.", translation = "Họ không nói chuyện với nhau nữa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "27"

[[grammar]]
key = "en.b1.others"
title = "Others: những người khác, những cái khác"
pattern = "others / the others"
forms = ["others"]
explanation = "Others là đại từ số nhiều, đứng một mình nghĩa là \"những người/cái khác\". The others là phần còn lại của một nhóm đã biết."
examples = [
  { text = "Some people like it, others don't.", translation = "Có người thích, có người không." },
  { text = "Try to think about others.", translation = "Hãy cố nghĩ cho người khác." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "29"

[[grammar]]
key = "en.b1.something_adjective"
title = "Something + tính từ: something new"
pattern = "something / anything / nothing / someone + tính từ"
forms = ["something", "anything", "nothing", "everything", "someone", "anyone", "somebody", "anybody", "nobody", "everyone", "somewhere", "anywhere"]
explanation = "Với các từ something, anything, nothing, someone…, tính từ đứng sau chứ không đứng trước: something new (một điều gì đó mới)."
examples = [
  { text = "I want to try something new.", translation = "Tôi muốn thử điều gì đó mới." },
  { text = "Is there anything interesting on TV?", translation = "Trên TV có gì hay không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "31"

[[grammar]]
key = "en.b1.attitude_adverbs"
title = "Trạng từ thái độ: fortunately, clearly"
pattern = "Fortunately / Unfortunately / Clearly / Apparently, + câu"
forms = ["fortunately", "unfortunately", "luckily", "clearly", "obviously", "apparently", "frankly", "honestly", "hopefully", "surprisingly"]
explanation = "Những trạng từ này thường đứng đầu câu để cho biết người nói nghĩ gì về cả câu: may mà, tiếc là, rõ ràng, nghe nói là."
examples = [
  { text = "Fortunately, nobody was hurt.", translation = "May mà không ai bị thương." },
  { text = "Apparently, the shop is closing.", translation = "Nghe nói cửa hàng sắp đóng cửa." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "34"

[[grammar]]
key = "en.b1.too_to"
title = "Too … to: quá … đến nỗi không"
pattern = "too + tính từ/trạng từ (+ for ai) + to + động từ"
forms = ["too"]
explanation = "Too … to nói một mức độ vượt quá, khiến việc gì đó không làm được: too tired to walk (mệt quá không đi nổi)."
examples = [
  { text = "I was too tired to cook.", translation = "Tôi mệt quá không nấu nổi." },
  { text = "This box is too heavy for me to carry.", translation = "Cái hộp này nặng quá, tôi không xách nổi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "44"

[[grammar]]
key = "en.b1.so_that_result"
title = "So … that: đến nỗi mà"
pattern = "so + tính từ/trạng từ + (that) + câu"
forms = ["so"]
explanation = "So … that nối một mức độ với kết quả của nó: so tired that I fell asleep. That thường được lược khi nói."
examples = [
  { text = "It was so hot that we stayed inside.", translation = "Trời nóng đến nỗi chúng tôi ở trong nhà." },
  { text = "She spoke so fast I couldn't understand.", translation = "Cô ấy nói nhanh đến mức tôi không hiểu." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "45"

[[grammar]]
key = "en.b1.intensified_comparatives"
title = "Nhấn mạnh so sánh: much better, far bigger"
pattern = "much / far / a lot / even / still + so sánh hơn"
forms = ["much", "far", "a lot", "even", "still", "by far", "a bit", "slightly"]
explanation = "Đặt much, far, a lot trước so sánh hơn để nói \"hơn nhiều\"; even, still nghĩa là \"còn … hơn nữa\". Không dùng very trước so sánh hơn."
examples = [
  { text = "The new phone is much faster.", translation = "Điện thoại mới nhanh hơn nhiều." },
  { text = "Today is even colder than yesterday.", translation = "Hôm nay còn lạnh hơn hôm qua." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "51"

[[grammar]]
key = "en.b1.past_perfect"
title = "Quá khứ hoàn thành: đã … trước đó"
pattern = "had ('d) + quá khứ phân từ"
forms = ["had", "'d", "hadn't", "had not"]
explanation = "Dùng cho việc xảy ra trước một mốc khác trong quá khứ: When I arrived, the train had left (tàu đã đi trước khi tôi đến)."
examples = [
  { text = "When we arrived, the film had already started.", translation = "Khi chúng tôi đến, phim đã bắt đầu rồi." },
  { text = "I hadn't seen her before that day.", translation = "Trước hôm đó tôi chưa từng gặp cô ấy." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "67"

[[grammar]]
key = "en.b1.passive_modal"
title = "Bị động với động từ khuyết thiếu: can be done"
pattern = "can/must/should/will + be + quá khứ phân từ"
forms = ["be"]
explanation = "Sau can, must, should, will…, bị động có dạng be + quá khứ phân từ: It must be done today (việc này phải được làm hôm nay)."
examples = [
  { text = "This form must be signed by a parent.", translation = "Mẫu này phải có chữ ký của phụ huynh." },
  { text = "The tickets can be bought online.", translation = "Vé có thể mua trên mạng." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "82"

[[grammar]]
key = "en.b1.get_passive"
title = "Get + quá khứ phân từ: bị, được"
pattern = "get/got + quá khứ phân từ"
forms = ["get", "gets", "got", "gotten", "getting"]
explanation = "Trong văn nói, get thay cho be để nói một việc xảy đến với ai, thường bất ngờ: get married (cưới), get lost (lạc), get hurt (bị thương)."
examples = [
  { text = "We got lost in the old town.", translation = "Chúng tôi bị lạc trong phố cổ." },
  { text = "They got married last year.", translation = "Họ cưới nhau năm ngoái." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "87"

[[grammar]]
key = "en.b1.not_to"
title = "Not to + động từ: để không, đừng"
pattern = "… not to + động từ nguyên mẫu"
forms = ["not to"]
explanation = "Phủ định của to + động từ là not to, đặt not trước to: try not to be late, told me not to go."
examples = [
  { text = "Try not to be late.", translation = "Cố đừng đến muộn nhé." },
  { text = "I decided not to buy it.", translation = "Tôi quyết định không mua nó." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "89"

[[grammar]]
key = "en.b1.for_someone_to"
title = "For + người + to V"
pattern = "… for + người/vật + to + động từ"
forms = ["for"]
explanation = "Muốn nói ai là người làm việc ở dạng to + động từ, đặt for + người trước to: It's time for us to go."
examples = [
  { text = "It's time for us to go home.", translation = "Đến lúc chúng ta về nhà rồi." },
  { text = "I'm waiting for the bus to come.", translation = "Tôi đang đợi xe buýt đến." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "93"

[[grammar]]
key = "en.b1.be_to"
title = "Be to: theo lịch, theo kế hoạch"
pattern = "am/is/are/was/were + to + động từ"
forms = ["is to", "are to", "am to", "was to", "were to"]
explanation = "Be to + động từ nói một việc đã được sắp xếp hoặc yêu cầu chính thức, hay gặp trong tin tức: The president is to visit Japan."
examples = [
  { text = "The new bridge is to open next month.", translation = "Cây cầu mới dự kiến sẽ thông xe tháng sau." },
  { text = "You are to stay in the room until nine.", translation = "Các bạn phải ở trong phòng đến chín giờ." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "99"

[[grammar]]
key = "en.b1.be_able_to"
title = "Be able to: có khả năng"
pattern = "be able to + động từ nguyên mẫu"
forms = ["able to", "unable to"]
explanation = "Be able to nghĩa giống can, nhưng dùng được ở mọi thì: will be able to, have been able to. Cũng dùng để nói đã làm được một việc cụ thể."
examples = [
  { text = "I won't be able to come tomorrow.", translation = "Mai tôi không đến được." },
  { text = "She was able to fix the car herself.", translation = "Cô ấy đã tự sửa được xe." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "121"

[[grammar]]
key = "en.b1.could"
title = "Could: đã có thể, có thể"
pattern = "could / couldn't + động từ nguyên mẫu"
forms = ["could", "couldn't", "could not"]
explanation = "Could là quá khứ của can (I could swim when I was five), và cũng dùng để đưa gợi ý hay nói một khả năng: We could go by train."
examples = [
  { text = "I couldn't sleep last night.", translation = "Tối qua tôi không ngủ được." },
  { text = "We could meet on Friday.", translation = "Chúng ta có thể gặp vào thứ Sáu." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "124"

[[grammar]]
key = "en.b1.may"
title = "May: có thể, được phép"
pattern = "may (not) + động từ nguyên mẫu"
forms = ["may", "may not"]
explanation = "May nói một khả năng (có thể sẽ) hoặc sự cho phép trang trọng. May I …? là cách xin phép lịch sự."
examples = [
  { text = "It may snow tonight.", translation = "Tối nay có thể có tuyết." },
  { text = "May I sit here?", translation = "Tôi ngồi đây được không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "129"

[[grammar]]
key = "en.b1.must_deduction"
title = "Must / can't: chắc hẳn, chắc chắn không"
pattern = "must / can't + động từ nguyên mẫu (suy đoán)"
forms = ["must", "can't", "cannot"]
explanation = "Must còn dùng để suy luận gần như chắc chắn: You must be tired (chắc bạn mệt lắm). Ngược lại dùng can't: That can't be true."
examples = [
  { text = "You've worked all day. You must be tired.", translation = "Bạn làm cả ngày rồi. Chắc mệt lắm." },
  { text = "That can't be Tom. He's in London.", translation = "Đó không thể là Tom. Anh ấy đang ở London." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "135"

[[grammar]]
key = "en.b1.used_to"
title = "Used to: đã từng (nay không còn)"
pattern = "used to + động từ nguyên mẫu / didn't use to"
forms = ["used to", "use to"]
explanation = "Used to nói thói quen hoặc tình trạng trong quá khứ mà bây giờ không còn: I used to smoke (trước đây tôi hút thuốc)."
examples = [
  { text = "I used to live in Hue.", translation = "Tôi từng sống ở Huế." },
  { text = "We didn't use to have a car.", translation = "Trước đây nhà tôi không có xe hơi." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "140"

[[grammar]]
key = "en.b1.here_is"
title = "Here is / Here are: đây là"
pattern = "Here is/are + danh từ / Here you are"
forms = ["here is", "here are", "here's", "here you are", "here you go"]
explanation = "Dùng khi đưa hoặc chỉ cho ai một vật: Here's your coffee. Here you are là câu nói khi đưa đồ."
examples = [
  { text = "Here's your change.", translation = "Tiền thừa của anh đây." },
  { text = "Here are the keys to your room.", translation = "Đây là chìa khóa phòng của bạn." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "149"

[[grammar]]
key = "en.b1.as_soon_as"
title = "As soon as: ngay khi"
pattern = "as soon as + hiện tại/quá khứ, …"
forms = ["as soon as"]
explanation = "As soon as nghĩa là ngay sau khi. Nói về tương lai thì vế as soon as vẫn dùng hiện tại: I'll call you as soon as I arrive."
examples = [
  { text = "I'll call you as soon as I arrive.", translation = "Tôi sẽ gọi bạn ngay khi tôi đến." },
  { text = "As soon as she saw me, she started laughing.", translation = "Vừa thấy tôi, cô ấy đã bật cười." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "158"

[[grammar]]
key = "en.b1.wh_to_infinitive"
title = "How to / what to / where to + động từ"
pattern = "know/learn/tell + how/what/where + to + động từ"
forms = ["how to", "what to", "where to", "when to", "which to", "who to", "whether to"]
explanation = "Từ hỏi + to + động từ là cách gọn để nói \"nên làm gì, làm thế nào\": I don't know what to say (tôi không biết nói gì)."
examples = [
  { text = "Can you show me how to use this?", translation = "Bạn chỉ tôi cách dùng cái này được không?" },
  { text = "I don't know what to say.", translation = "Tôi không biết phải nói gì." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "167"

[[grammar]]
key = "en.b1.nonrestrictive_relative"
title = "Mệnh đề quan hệ có dấu phẩy: , who … / , which …"
pattern = "danh từ, who/which/whose …,"
forms = ["who", "which", "whose"]
explanation = "Mệnh đề giữa hai dấu phẩy chỉ thêm thông tin phụ về người hay vật đã rõ là ai, cái gì. Không dùng that trong loại mệnh đề này."
examples = [
  { text = "My sister, who lives in Hanoi, is a doctor.", translation = "Chị tôi, người sống ở Hà Nội, là bác sĩ." },
  { text = "We stayed at the Sun Hotel, which was very nice.", translation = "Chúng tôi ở khách sạn Sun, nơi đó rất đẹp." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "181"

[[grammar]]
key = "en.b1.that_is_why"
title = "That's where / why / how …"
pattern = "That's / This is + where/why/when/how + câu"
forms = ["where", "why", "when", "how"]
explanation = "Where, why, when, how có thể mở một vế câu đứng thay cho danh từ: That's why I'm late (đó là lý do tôi đến muộn)."
examples = [
  { text = "That's why I called you.", translation = "Đó là lý do tôi gọi bạn." },
  { text = "This is where we first met.", translation = "Đây là nơi chúng ta gặp nhau lần đầu." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "186"

[[grammar]]
key = "en.b1.tag_questions"
title = "Câu hỏi đuôi: …, isn't it?"
pattern = "câu khẳng định, + trợ động từ phủ định + đại từ?"
explanation = "Câu hỏi đuôi dùng để xác nhận điều mình nghĩ là đúng. Câu khẳng định thì đuôi phủ định, dùng lại trợ động từ của câu: It's cold, isn't it? You like tea, don't you?"
examples = [
  { text = "It's a lovely day, isn't it?", translation = "Hôm nay trời đẹp nhỉ?" },
  { text = "You live near here, don't you?", translation = "Bạn sống gần đây phải không?" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "193"

[[grammar]]
key = "en.b1.reported_tell"
title = "Thuật lại với tell: told me (that) …"
pattern = "tell + người + (that) + câu lùi thì"
forms = ["tell", "tells", "told"]
explanation = "Tell luôn có người nghe ngay sau: She told me (that) she was busy. Say thì không có người nghe ngay sau (She said she was busy)."
examples = [
  { text = "He told me he was moving to Hue.", translation = "Anh ấy bảo tôi là anh ấy sắp chuyển đến Huế." },
  { text = "She told us that the meeting was cancelled.", translation = "Cô ấy báo với chúng tôi là cuộc họp bị hủy." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "201"

[[grammar]]
key = "en.b1.reported_question"
title = "Thuật lại câu hỏi: asked me where/if …"
pattern = "ask + người + từ hỏi/if + chủ ngữ + động từ"
forms = ["ask", "asks", "asked"]
explanation = "Khi kể lại câu hỏi, dùng asked, giữ trật tự câu kể và lùi thì. Câu hỏi có/không dùng if hoặc whether: She asked if I was free."
examples = [
  { text = "She asked me where I lived.", translation = "Cô ấy hỏi tôi sống ở đâu." },
  { text = "He asked if I was free on Sunday.", translation = "Anh ấy hỏi tôi Chủ nhật có rảnh không." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "203"

[[grammar]]
key = "en.b1.ask_tell_to"
title = "Ask / tell + người + to V: nhờ, bảo ai làm gì"
pattern = "ask/tell/want + người + (not) to + động từ"
forms = ["ask", "asked", "tell", "told", "want", "wanted", "remind", "reminded"]
explanation = "Dùng để kể lại lời nhờ hay lời yêu cầu: asked me to wait (nhờ tôi đợi), told him not to worry (bảo anh ấy đừng lo)."
examples = [
  { text = "My boss asked me to stay late.", translation = "Sếp nhờ tôi ở lại muộn." },
  { text = "The doctor told me not to eat sugar.", translation = "Bác sĩ dặn tôi đừng ăn đường." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "209"

[[grammar]]
key = "en.b1.participle_clause"
title = "Cụm V-ing thay cho một vế câu"
pattern = "V-ing …, chủ ngữ + động từ"
explanation = "Một cụm bắt đầu bằng V-ing có thể thay cho một vế câu khi hai vế cùng chủ ngữ: Walking home, I met an old friend (trong lúc đi bộ về, tôi gặp…)."
examples = [
  { text = "Walking along the river, I saw an old friend.", translation = "Đang đi dọc bờ sông thì tôi thấy một người bạn cũ." },
  { text = "Feeling tired, she went to bed early.", translation = "Thấy mệt nên cô ấy đi ngủ sớm." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "213"

[[grammar]]
key = "en.b1.second_conditional"
title = "Câu điều kiện loại 2: nếu … thì đã/sẽ (không có thật)"
pattern = "If + quá khứ đơn, … would + động từ nguyên mẫu"
forms = ["if"]
explanation = "Nói điều tưởng tượng, không có thật hoặc khó xảy ra ở hiện tại. Vế if dùng quá khứ, vế kia dùng would: If I had money, I would travel. Với be có thể dùng were cho mọi ngôi."
examples = [
  { text = "If I had more time, I would learn to cook.", translation = "Nếu có nhiều thời gian hơn, tôi sẽ học nấu ăn." },
  { text = "If I were you, I'd take the job.", translation = "Nếu tôi là bạn, tôi sẽ nhận công việc đó." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "215"

[[grammar]]
key = "en.b1.exclamations"
title = "Câu cảm thán: What a …! / How …!"
pattern = "What (a/an) + tính từ + danh từ! / How + tính từ!"
forms = ["what", "how"]
explanation = "Dùng để bày tỏ cảm xúc mạnh. What đi với cụm danh từ (What a beautiful day!), How đi với tính từ hoặc trạng từ đứng một mình (How beautiful!)."
examples = [
  { text = "What a beautiful view!", translation = "Cảnh đẹp quá!" },
  { text = "How kind of you!", translation = "Bạn tốt bụng quá!" },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "192"

[[grammar]]
key = "en.b1.make_object_adjective"
title = "Make + người/vật + tính từ"
pattern = "make + tân ngữ + tính từ"
forms = ["make", "makes", "made", "making"]
explanation = "Make + người + tính từ nghĩa là làm cho ai cảm thấy hoặc trở nên như thế nào: The news made me happy."
examples = [
  { text = "This song always makes me happy.", translation = "Bài hát này luôn làm tôi vui." },
  { text = "The long wait made everyone angry.", translation = "Đợi lâu làm mọi người bực bội." },
]
source = "cefrj-grammar-profile-20180315"
source_ref = "199"

