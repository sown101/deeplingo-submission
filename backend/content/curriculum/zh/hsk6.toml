# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "zh.hsk6.suffixes"
title = "Hậu tố -化, -性, -式, -型"
pattern = "danh từ/tính từ + 化/性/式/型"
forms = ["化", "性", "式", "型"]
explanation = "Các hậu tố tạo từ mới: -化 là \"hóa\" (现代化, 国际化), -性 là \"tính\" (重要性), -式 là kiểu (中式), -型 là loại hình (新型)."
examples = [
  { text = "这座城市越来越国际化了。", translation = "Thành phố này ngày càng quốc tế hóa." },
  { text = "大家都明白这件事的重要性。", translation = "Mọi người đều hiểu tầm quan trọng của việc này." },
]
source = "gf0025-2021"
source_ref = "360"

[[grammar]]
key = "zh.hsk6.ben_ci"
title = "本, 此: này (văn viết)"
pattern = "本 + danh từ (本公司) / 此 + danh từ (此事)"
forms = ["本", "此"]
explanation = "本 chỉ chính đơn vị của người nói: 本店 (cửa hàng chúng tôi), 本人 (bản thân tôi). 此 là \"này\" trong văn viết: 此外, 因此, 此时."
examples = [
  { text = "本店今天停业一天。", translation = "Cửa hàng chúng tôi hôm nay nghỉ một ngày." },
  { text = "此事以后再说。", translation = "Việc này để sau hẵng bàn." },
]
source = "gf0025-2021"
source_ref = "361"

[[grammar]]
key = "zh.hsk6.yitong"
title = "一同, 一齐, 尽: cùng nhau, đồng loạt"
pattern = "一同/一齐 + động từ / 尽 + động từ"
forms = ["一同", "一齐", "尽", "净"]
explanation = "一同 là cùng nhau (trang trọng hơn 一起); 一齐 là đồng loạt cùng lúc; 尽, 净 là toàn, chỉ toàn."
examples = [
  { text = "欢迎您和家人一同参加。", translation = "Hoan nghênh quý vị cùng gia đình tham dự." },
  { text = "大家一齐鼓掌。", translation = "Mọi người đồng loạt vỗ tay." },
]
source = "gf0025-2021"
source_ref = "365"

[[grammar]]
key = "zh.hsk6.yishi_zaowan"
title = "一时, 早晚: nhất thời, sớm muộn"
pattern = "一时 + động từ / 早晚 + động từ"
forms = ["一时", "早晚", "时时"]
explanation = "一时 là nhất thời, trong lúc này (一时想不起来: nhất thời không nhớ ra); 早晚 là sớm muộn gì cũng."
examples = [
  { text = "我一时想不起他的名字。", translation = "Nhất thời tôi không nhớ ra tên anh ấy." },
  { text = "这件事他早晚会知道的。", translation = "Việc này sớm muộn gì anh ấy cũng biết." },
]
source = "gf0025-2021"
source_ref = "366"

[[grammar]]
key = "zh.hsk6.bian"
title = "便: liền, thì (văn viết của 就)"
pattern = "… 便 + động từ"
forms = ["便"]
explanation = "便 dùng như 就 trong văn viết: 一到家便睡了 (vừa về đến nhà liền ngủ)."
examples = [
  { text = "他一到家便睡着了。", translation = "Anh ấy vừa về đến nhà liền ngủ thiếp đi." },
  { text = "有问题便来找我。", translation = "Có vấn đề gì thì cứ đến tìm tôi." },
]
source = "gf0025-2021"
source_ref = "367"

[[grammar]]
key = "zh.hsk6.manner_adverbs"
title = "不禁, 特意, 亲眼: không kìm được, cố ý, tận mắt"
pattern = "不禁/特意/特地/亲眼/赶忙 + động từ"
forms = ["不禁", "特意", "特地", "亲眼", "赶忙"]
explanation = "不禁 là không kìm được mà; 特意, 特地 là cố ý, riêng để; 亲眼 là tận mắt; 赶忙 là vội vàng."
examples = [
  { text = "看到这张照片，她不禁笑了。", translation = "Nhìn bức ảnh này, cô ấy không nhịn được cười." },
  { text = "他特意从上海赶来看我。", translation = "Anh ấy cất công từ Thượng Hải đến thăm tôi." },
]
source = "gf0025-2021"
source_ref = "368"

[[grammar]]
key = "zh.hsk6.fangfu"
title = "仿佛: dường như, tựa như"
pattern = "仿佛 + câu / 仿佛……一样/似的"
forms = ["仿佛"]
explanation = "仿佛 là dường như, tựa như, mang sắc thái văn chương: 仿佛回到了童年 (như được trở về tuổi thơ)."
examples = [
  { text = "走在老街上，我仿佛回到了童年。", translation = "Đi trên phố cổ, tôi như được trở về tuổi thơ." },
  { text = "他仿佛什么都没听见。", translation = "Anh ấy dường như chẳng nghe thấy gì." },
]
source = "gf0025-2021"
source_ref = "369"

[[grammar]]
key = "zh.hsk6.pian_qiahao"
title = "偏, 恰好, 刚好: cứ nhất định, vừa đúng"
pattern = "偏(偏) + động từ / 恰好/刚好 + …"
forms = ["偏", "偏偏", "恰好", "刚好", "才"]
explanation = "偏 là cứ nhất quyết làm ngược lại, hoặc ngược với mong muốn: 我让他别去，他偏要去. 恰好, 刚好 là vừa đúng lúc, vừa khớp."
examples = [
  { text = "我叫他别去，他偏要去。", translation = "Tôi bảo đừng đi, anh ấy cứ nhất định đi." },
  { text = "我到车站的时候，车恰好开走了。", translation = "Lúc tôi đến bến thì xe vừa đúng lúc chạy mất." },
]
source = "gf0025-2021"
source_ref = "370"

[[grammar]]
key = "zh.hsk6.yu_at"
title = "于: ở, vào, với (văn viết)"
pattern = "động từ + 于 + thời gian/nơi chốn/đối tượng"
forms = ["于"]
explanation = "于 là giới từ văn viết, tương đương 在, 对, 从…: 生于1990年 (sinh năm 1990), 有利于健康 (có lợi cho sức khỏe)."
examples = [
  { text = "他出生于1990年。", translation = "Anh ấy sinh năm 1990." },
  { text = "多运动有利于健康。", translation = "Vận động nhiều có lợi cho sức khỏe." },
]
source = "gf0025-2021"
source_ref = "371"

[[grammar]]
key = "zh.hsk6.yanzhe"
title = "沿(着): men theo, dọc theo"
pattern = "沿(着) + con đường/dòng sông + động từ"
forms = ["沿着", "沿"]
explanation = "沿着 nghĩa là đi theo, dọc theo một tuyến: 沿着河边走 (đi dọc bờ sông)."
examples = [
  { text = "我们沿着河边散步。", translation = "Chúng tôi đi dạo dọc bờ sông." },
  { text = "沿这条路一直走就到了。", translation = "Cứ đi theo con đường này là đến." },
]
source = "gf0025-2021"
source_ref = "372"

[[grammar]]
key = "zh.hsk6.yu_with"
title = "与, 同: với, cùng (văn viết)"
pattern = "A + 与/同 + B + động từ"
forms = ["与", "同"]
explanation = "与, 同 làm giới từ nghĩa là với, cùng (văn viết của 跟, 和): 与朋友讨论 (bàn với bạn)."
examples = [
  { text = "这个问题我想与大家讨论一下。", translation = "Vấn đề này tôi muốn bàn với mọi người một chút." },
  { text = "他同我一起长大。", translation = "Anh ấy lớn lên cùng tôi." },
]
source = "gf0025-2021"
source_ref = "373"

[[grammar]]
key = "zh.hsk6.zhiyu"
title = "至于: còn về"
pattern = "…。至于 + chủ đề khác，…"
forms = ["至于"]
explanation = "至于 chuyển sang một chủ đề liên quan nhưng khác: 至于费用，我们以后再谈 (còn về chi phí thì bàn sau)."
examples = [
  { text = "我同意去，至于什么时候去，你来定吧。", translation = "Tôi đồng ý đi, còn về việc khi nào đi thì bạn quyết nhé." },
  { text = "至于费用问题，我们以后再谈。", translation = "Còn về chi phí, chúng ta bàn sau." },
]
source = "gf0025-2021"
source_ref = "374"

[[grammar]]
key = "zh.hsk6.yin"
title = "因: vì, do (văn viết)"
pattern = "因 + nguyên nhân + 而/động từ"
forms = ["因"]
explanation = "因 là giới từ văn viết chỉ nguyên nhân, hay gặp trong thông báo: 因天气原因，航班取消."
examples = [
  { text = "因天气原因，航班取消了。", translation = "Do thời tiết, chuyến bay đã bị hủy." },
  { text = "他因病请假了。", translation = "Anh ấy xin nghỉ vì ốm." },
]
source = "gf0025-2021"
source_ref = "375"

[[grammar]]
key = "zh.hsk6.ju"
title = "据: theo (nguồn tin)"
pattern = "据 + nguồn/据说/据了解，…"
forms = ["据", "据说", "据了解"]
explanation = "据 nêu nguồn của thông tin: 据报道 (theo đưa tin), 据说 (nghe nói)."
examples = [
  { text = "据报道，明天将有大雨。", translation = "Theo đưa tin, ngày mai sẽ có mưa lớn." },
  { text = "据说这家饭馆很有名。", translation = "Nghe nói nhà hàng này rất nổi tiếng." },
]
source = "gf0025-2021"
source_ref = "377"

[[grammar]]
key = "zh.hsk6.buliao_ruo"
title = "不料, 若: không ngờ, nếu"
pattern = "…，不料 + điều bất ngờ / 若 + điều kiện，…"
forms = ["不料", "若"]
explanation = "不料 là không ngờ (văn viết); 若 là nếu (văn viết của 如果): 若有问题，请联系我们."
examples = [
  { text = "本想出去走走，不料下起了大雨。", translation = "Định ra ngoài đi dạo, không ngờ trời đổ mưa to." },
  { text = "若有问题，请随时联系我们。", translation = "Nếu có vấn đề, xin liên hệ với chúng tôi bất cứ lúc nào." },
]
source = "gf0025-2021"
source_ref = "379"

[[grammar]]
key = "zh.hsk6.suo"
title = "所: trợ từ 所 + động từ"
pattern = "(chủ ngữ +) 所 + động từ + (的 + danh từ)"
forms = ["所"]
explanation = "所 đứng trước động từ để tạo cụm danh từ trang trọng: 我所知道的 (những gì tôi biết), 为…所 + động từ là bị động văn viết."
examples = [
  { text = "这就是我所知道的一切。", translation = "Đây là tất cả những gì tôi biết." },
  { text = "他的话为大家所接受。", translation = "Lời anh ấy được mọi người chấp nhận." },
]
source = "gf0025-2021"
source_ref = "380"

[[grammar]]
key = "zh.hsk6.mood_particles_6"
title = "Trợ từ ngữ khí: 罢了, 嘛, 啦"
pattern = "câu + 罢了 / 嘛 / 啦"
forms = ["罢了", "嘛", "啦"]
explanation = "罢了 là chỉ … mà thôi (giảm nhẹ); 嘛 nhấn mạnh điều hiển nhiên (có gì đâu, vốn là thế mà); 啦 là 了 + 啊, thể hiện cảm xúc."
examples = [
  { text = "我只是开个玩笑罢了。", translation = "Tôi chỉ đùa thôi mà." },
  { text = "有问题就问嘛。", translation = "Có vấn đề thì cứ hỏi thôi mà." },
]
source = "gf0025-2021"
source_ref = "381"

[[grammar]]
key = "zh.hsk6.buzenme"
title = "不怎么: không … lắm"
pattern = "不怎么 + động từ/tính từ"
forms = ["不怎么", "不怎么样"]
explanation = "不怎么 làm nhẹ phủ định: 不怎么喜欢 (không thích lắm). 不怎么样 là chẳng ra sao."
examples = [
  { text = "我不怎么喜欢吃甜的。", translation = "Tôi không thích ăn đồ ngọt lắm." },
  { text = "那部电影不怎么样。", translation = "Bộ phim đó chẳng ra sao." },
]
source = "gf0025-2021"
source_ref = "387"

[[grammar]]
key = "zh.hsk6.haoburongyi"
title = "好（不）容易: mãi mới, vất vả lắm mới"
pattern = "好不容易/好容易 + 才 + động từ"
forms = ["好不容易", "好容易"]
explanation = "Cả 好容易 và 好不容易 đều nghĩa là vất vả lắm mới, thường đi với 才."
examples = [
  { text = "我好不容易才找到这家店。", translation = "Tôi vất vả lắm mới tìm được cửa hàng này." },
  { text = "好容易等到周末，又要加班。", translation = "Mãi mới đến cuối tuần, lại phải làm thêm." },
]
source = "gf0025-2021"
source_ref = "389"

[[grammar]]
key = "zh.hsk6.jiushishuo"
title = "就是说: nghĩa là, tức là"
pattern = "…，(这)就是说，…"
forms = ["就是说", "也就是说"]
explanation = "Dùng để giải thích lại ý vừa nói bằng cách khác: 也就是说 (cũng tức là)."
examples = [
  { text = "他没回电话，就是说他不想去。", translation = "Anh ấy không gọi lại, tức là anh ấy không muốn đi." },
  { text = "也就是说，我们得重新开始。", translation = "Cũng tức là chúng ta phải bắt đầu lại." },
]
source = "gf0025-2021"
source_ref = "391"

[[grammar]]
key = "zh.hsk6.suanle"
title = "算了: thôi bỏ đi"
pattern = "算了(吧) / … 就算了"
forms = ["算了"]
explanation = "算了 là thôi, bỏ qua, không bàn tiếp nữa: 算了，别说了 (thôi, đừng nói nữa)."
examples = [
  { text = "算了，我们不去了。", translation = "Thôi, chúng ta không đi nữa." },
  { text = "不想吃就算了。", translation = "Không muốn ăn thì thôi." },
]
source = "gf0025-2021"
source_ref = "392"

[[grammar]]
key = "zh.hsk6.weile_er"
title = "为了……而……: vì … mà …"
pattern = "为了 + mục đích + 而 + động từ"
forms = ["而"]
explanation = "而 nối mục đích với hành động trong văn viết: 为了理想而努力 (nỗ lực vì lý tưởng)."
examples = [
  { text = "他们为了理想而努力。", translation = "Họ nỗ lực vì lý tưởng." },
  { text = "不要为了小事而生气。", translation = "Đừng vì chuyện nhỏ mà nổi giận." },
]
source = "gf0025-2021"
source_ref = "395"

[[grammar]]
key = "zh.hsk6.direction_state"
title = "Bổ ngữ xu hướng chỉ trạng thái: 静下来, 好起来"
pattern = "động từ/tính từ + 下来/下去/起来/过来"
forms = ["下来", "下去", "起来", "过来"]
explanation = "Bổ ngữ xu hướng nói trạng thái thay đổi: 安静下来 (lặng xuống), 好起来 (khá lên), 冷下去 (lạnh dần), 醒过来 (tỉnh lại)."
examples = [
  { text = "教室里慢慢安静下来了。", translation = "Lớp học dần dần yên lặng." },
  { text = "天气渐渐暖和起来了。", translation = "Thời tiết dần ấm lên." },
]
source = "gf0025-2021"
source_ref = "397"

[[grammar]]
key = "zh.hsk6.ba_causative"
title = "Câu 把 chỉ khiến: 把他急坏了"
pattern = "chủ ngữ (sự việc) + 把 + người + động từ/tính từ + bổ ngữ"
forms = ["把"]
explanation = "Câu 把 có thể nói một sự việc khiến người ta rơi vào trạng thái nào đó: 这件事把我急坏了 (việc này làm tôi sốt ruột chết đi được)."
examples = [
  { text = "这个消息把大家都高兴坏了。", translation = "Tin này làm mọi người vui phát điên." },
  { text = "孩子发烧，把妈妈急哭了。", translation = "Con bị sốt làm mẹ sốt ruột đến phát khóc." },
]
source = "gf0025-2021"
source_ref = "398"

[[grammar]]
key = "zh.hsk6.bei_gei"
title = "被……给……: bị … (khẩu ngữ, nhấn mạnh)"
pattern = "chủ ngữ + 被/叫/让 + người + 给 + động từ + thành phần khác"
forms = ["给"]
explanation = "Thêm 给 trước động từ trong câu bị động để nhấn mạnh, mang tính khẩu ngữ: 我的蛋糕被弟弟给吃了."
examples = [
  { text = "我的自行车让人给骑走了。", translation = "Xe đạp của tôi bị người ta đạp đi mất rồi." },
  { text = "衣服被雨给淋湿了。", translation = "Quần áo bị mưa làm ướt hết." },
]
source = "gf0025-2021"
source_ref = "399"

[[grammar]]
key = "zh.hsk6.budan_bu_faner"
title = "不但不……，反而……: chẳng những không … ngược lại còn …"
pattern = "不但不/没有 + A，反而 + B"
forms = ["反而"]
explanation = "Kết quả trái hẳn với mong đợi: 不但没好，反而更严重了 (chẳng những không đỡ, ngược lại còn nặng hơn)."
examples = [
  { text = "吃了药，他的病不但没好，反而更重了。", translation = "Uống thuốc rồi, bệnh anh ấy chẳng những không đỡ mà còn nặng hơn." },
  { text = "他不但不感谢我，反而怪我。", translation = "Anh ta chẳng những không cảm ơn mà còn trách tôi." },
]
source = "gf0025-2021"
source_ref = "403"

[[grammar]]
key = "zh.hsk6.yaome"
title = "要么……，要么……: hoặc là … hoặc là …"
pattern = "要么 + A，要么 + B"
forms = ["要么"]
explanation = "Đưa ra hai lựa chọn, bắt buộc chọn một: 要么现在走，要么别去了."
examples = [
  { text = "要么现在就走，要么干脆别去。", translation = "Hoặc là đi ngay bây giờ, hoặc là thôi đừng đi." },
  { text = "周末我要么在家看书，要么去爬山。", translation = "Cuối tuần tôi hoặc là ở nhà đọc sách, hoặc là đi leo núi." },
]
source = "gf0025-2021"
source_ref = "406"

[[grammar]]
key = "zh.hsk6.sui_que"
title = "虽……，但/却……: tuy … nhưng"
pattern = "chủ ngữ + 虽 + A，但/却/可 + B"
forms = ["虽"]
explanation = "虽 là dạng văn viết của 虽然, thường đứng sau chủ ngữ: 他虽年轻，却很有经验."
examples = [
  { text = "他虽年轻，却很有经验。", translation = "Anh ấy tuy trẻ nhưng rất có kinh nghiệm." },
  { text = "这里虽小，但很舒服。", translation = "Chỗ này tuy nhỏ nhưng rất thoải mái." },
]
source = "gf0025-2021"
source_ref = "407"

[[grammar]]
key = "zh.hsk6.fanshi_dou"
title = "凡是……，都……: hễ là … đều …"
pattern = "凡是 + phạm vi，都 + …"
forms = ["凡是"]
explanation = "凡是 bao quát mọi trường hợp thuộc phạm vi đó, không có ngoại lệ."
examples = [
  { text = "凡是去过那儿的人，都说那里很美。", translation = "Hễ ai đã đến đó đều nói nơi ấy rất đẹp." },
  { text = "凡是学生，都可以免费参观。", translation = "Hễ là học sinh đều được tham quan miễn phí." },
]
source = "gf0025-2021"
source_ref = "409"

[[grammar]]
key = "zh.hsk6.jiusuan_ye"
title = "就算/就是……，也……: cho dù … cũng …"
pattern = "就算/就是 + giả định，也 + …"
forms = ["就算"]
explanation = "Nghĩa như 即使 nhưng mang tính khẩu ngữ: 就算你不说，我也知道."
examples = [
  { text = "就算你不说，我也知道。", translation = "Cho dù bạn không nói thì tôi cũng biết." },
  { text = "就算再难，我也要试一试。", translation = "Cho dù khó đến mấy, tôi cũng phải thử." },
]
source = "gf0025-2021"
source_ref = "410"

[[grammar]]
key = "zh.hsk6.fei_buke"
title = "非……不可: nhất định phải"
pattern = "非 + động từ/người + 不可"
forms = ["非", "不可"]
explanation = "Phủ định kép nhấn mạnh sự bắt buộc hoặc quyết tâm: 我非去不可 (tôi nhất định phải đi)."
examples = [
  { text = "这件事非你去不可。", translation = "Việc này nhất định phải bạn đi mới được." },
  { text = "他今天非要见到经理不可。", translation = "Hôm nay anh ta nhất quyết phải gặp được giám đốc." },
]
source = "gf0025-2021"
source_ref = "413"

