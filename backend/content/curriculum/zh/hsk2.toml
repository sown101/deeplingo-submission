# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "zh.hsk2.keyi_keneng"
title = "可以 và 可能: được phép, có thể"
pattern = "可以 + động từ / 可能 + động từ"
forms = ["可以", "可能"]
explanation = "可以 nói được phép hoặc có điều kiện làm được (这儿可以拍照吗？). 可能 nói khả năng, phỏng đoán: có lẽ, có thể (他可能不来了)."
examples = [
  { text = "这里可以坐吗？", translation = "Ngồi ở đây được không?" },
  { text = "明天可能下雨。", translation = "Mai có thể trời mưa." },
]
source = "gf0025-2021"
source_ref = "49"

[[grammar]]
key = "zh.hsk2.yinggai"
title = "应该: nên, phải"
pattern = "应该 / 该 + động từ"
forms = ["应该", "该"]
explanation = "应该 nói điều nên làm hoặc lẽ ra phải như vậy. Phủ định là 不应该 (không nên)."
examples = [
  { text = "你应该多休息。", translation = "Bạn nên nghỉ ngơi nhiều hơn." },
  { text = "我们不应该迟到。", translation = "Chúng ta không nên đến muộn." },
]
source = "gf0025-2021"
source_ref = "50"

[[grammar]]
key = "zh.hsk2.yuanyi"
title = "愿意: sẵn lòng, muốn"
pattern = "愿意 + động từ / 不愿意 + động từ"
forms = ["愿意"]
explanation = "愿意 nói sẵn lòng, đồng ý làm việc gì theo ý mình. 不愿意 là không muốn, không chịu."
examples = [
  { text = "你愿意跟我一起去吗？", translation = "Bạn có muốn đi cùng tôi không?" },
  { text = "他不愿意说。", translation = "Anh ấy không muốn nói." },
]
source = "gf0025-2021"
source_ref = "51"

[[grammar]]
key = "zh.hsk2.verb_reduplication"
title = "Lặp động từ: 看看, 试一试"
pattern = "AA / A一A / A了A / ABAB (động từ lặp lại)"
explanation = "Lặp động từ làm câu nhẹ nhàng hơn, nghĩa là làm thử, làm một chút: 看看 (xem thử), 试一试 (thử xem), 休息休息 (nghỉ một chút)."
examples = [
  { text = "我看看你的照片。", translation = "Để tôi xem ảnh của bạn một chút." },
  { text = "你试一试这件衣服。", translation = "Bạn mặc thử cái áo này xem." },
]
source = "gf0025-2021"
source_ref = "52"

[[grammar]]
key = "zh.hsk2.question_words_2"
title = "为什么, 怎么样, 多久: vì sao, thế nào, bao lâu"
pattern = "为什么 + … ? / … 怎么样？ / 多久？"
forms = ["为什么", "怎么样", "怎样", "多久"]
explanation = "为什么 hỏi lý do, 怎么样 hỏi tình trạng hay ý kiến (thế nào), 多久 hỏi khoảng thời gian (bao lâu)."
examples = [
  { text = "你为什么学中文？", translation = "Tại sao bạn học tiếng Trung?" },
  { text = "你在北京住了多久？", translation = "Bạn đã ở Bắc Kinh bao lâu?" },
]
source = "gf0025-2021"
source_ref = "53"

[[grammar]]
key = "zh.hsk2.pronouns_2"
title = "Đại từ 自己, 大家, 别人, 咱们"
pattern = "自己 / 大家 / 别人 / 咱们 / 它"
forms = ["自己", "大家", "别人", "咱们", "咱", "它", "它们"]
explanation = "自己 là tự mình, 大家 là mọi người, 别人 là người khác, 咱们 là chúng ta (gồm cả người nghe), 它 là nó (chỉ vật, con vật)."
examples = [
  { text = "大家好！", translation = "Chào mọi người!" },
  { text = "这件事我自己做。", translation = "Việc này tôi tự làm." },
]
source = "gf0025-2021"
source_ref = "54"

[[grammar]]
key = "zh.hsk2.zheme_name"
title = "这么, 那么, 这样, 那样"
pattern = "这么/那么 + tính từ / 这样/那样 + động từ"
forms = ["这么", "那么", "这样", "那样"]
explanation = "这么, 那么 + tính từ nghĩa là \"như thế này, như thế kia\" (这么贵: đắt thế). 这样, 那样 chỉ cách làm hay tính chất (这样做: làm như vậy)."
examples = [
  { text = "今天怎么这么冷？", translation = "Sao hôm nay lạnh thế này?" },
  { text = "你不能这样做。", translation = "Bạn không thể làm như vậy." },
]
source = "gf0025-2021"
source_ref = "55"

[[grammar]]
key = "zh.hsk2.verbal_measure_words"
title = "Lượng từ của động tác: 次, 遍, 下"
pattern = "động từ + số + 次/遍/下/回"
forms = ["次", "遍", "下", "回", "场"]
explanation = "Đếm số lần làm: 次 (lần), 遍 (lượt, từ đầu đến cuối), 下 (một cái, một chút), 回 (lần, khẩu ngữ). Đặt sau động từ: 去过两次."
examples = [
  { text = "我去过两次上海。", translation = "Tôi đã đến Thượng Hải hai lần." },
  { text = "请再说一遍。", translation = "Làm ơn nói lại một lần nữa." },
]
source = "gf0025-2021"
source_ref = "59"

[[grammar]]
key = "zh.hsk2.degree_adverbs_2"
title = "Phó từ mức độ: 更, 特别, 有点儿, 挺"
pattern = "更 / 特别 / 挺…的 / 有点儿 + tính từ"
forms = ["更", "特别", "挺", "有点儿", "有一点儿", "十分", "多么", "好"]
explanation = "更 là hơn nữa, 特别 là đặc biệt, rất; 挺…的 là khá (khẩu ngữ). 有点儿 + tính từ thường mang ý không hài lòng: 有点儿贵 (hơi đắt)."
examples = [
  { text = "这个菜有点儿辣。", translation = "Món này hơi cay." },
  { text = "他的汉语挺好的。", translation = "Tiếng Trung của anh ấy khá tốt." },
]
source = "gf0025-2021"
source_ref = "61"

[[grammar]]
key = "zh.hsk2.zhi_yigong"
title = "只, 一共, 全: chỉ, tổng cộng, toàn bộ"
pattern = "只 + động từ / 一共 + số lượng / 全 + động từ"
forms = ["只", "一共", "全"]
explanation = "只 là chỉ, giới hạn phạm vi (只有一个). 一共 là tổng cộng, hay dùng khi tính tiền. 全 là tất cả, toàn bộ."
examples = [
  { text = "一共多少钱？", translation = "Tổng cộng bao nhiêu tiền?" },
  { text = "我只喝了一杯。", translation = "Tôi chỉ uống một cốc." },
]
source = "gf0025-2021"
source_ref = "62"

[[grammar]]
key = "zh.hsk2.time_adverbs_2"
title = "已经, 刚, 一直, 忽然"
pattern = "已经…了 / 刚 + động từ / 一直 + động từ / 忽然 + động từ"
forms = ["已经", "刚", "刚刚", "一直", "忽然", "还"]
explanation = "已经…了 là đã … rồi; 刚 là vừa mới; 一直 là suốt, luôn luôn; 忽然 là bỗng nhiên; 还 là vẫn còn."
examples = [
  { text = "我已经吃饭了。", translation = "Tôi ăn cơm rồi." },
  { text = "他刚到家。", translation = "Anh ấy vừa về đến nhà." },
]
source = "gf0025-2021"
source_ref = "63"

[[grammar]]
key = "zh.hsk2.you_again"
title = "又, 经常, 老是: lại, thường, cứ"
pattern = "又 + động từ (+ 了) / 经常 + động từ / 老是 + động từ"
forms = ["又", "经常", "老", "老是", "重新"]
explanation = "又 nói việc lặp lại đã xảy ra (他又迟到了: anh ấy lại đến muộn). 经常 là thường xuyên; 老是 là cứ, suốt (thường kèm ý phàn nàn)."
examples = [
  { text = "他又迟到了。", translation = "Anh ấy lại đến muộn." },
  { text = "我经常去那家饭馆。", translation = "Tôi thường đến nhà hàng đó." },
]
source = "gf0025-2021"
source_ref = "64"

[[grammar]]
key = "zh.hsk2.jiu_soon"
title = "就: ngay, sớm, liền"
pattern = "thời gian + 就 + động từ"
forms = ["就"]
explanation = "就 đặt trước động từ nhấn mạnh việc xảy ra sớm, nhanh hoặc ngay sau đó: 我八点就到了 (mới tám giờ tôi đã đến)."
examples = [
  { text = "我马上就来。", translation = "Tôi đến ngay đây." },
  { text = "他六点就起床了。", translation = "Mới sáu giờ anh ấy đã dậy rồi." },
]
source = "gf0025-2021"
source_ref = "65"

[[grammar]]
key = "zh.hsk2.modal_adverbs_2"
title = "必须, 也许, 好像, 差不多"
pattern = "必须 / 也许 / 好像 / 差不多 + động từ hoặc tính từ"
forms = ["必须", "也许", "好像", "差不多"]
explanation = "必须 là bắt buộc phải; 也许 là có lẽ; 好像 là hình như; 差不多 là gần như, xấp xỉ."
examples = [
  { text = "你必须早点儿睡觉。", translation = "Bạn phải đi ngủ sớm một chút." },
  { text = "他好像生病了。", translation = "Hình như anh ấy bị ốm." },
]
source = "gf0025-2021"
source_ref = "67"

[[grammar]]
key = "zh.hsk2.cai_late"
title = "才: mới (muộn, chậm)"
pattern = "thời gian + 才 + động từ"
forms = ["才"]
explanation = "才 trước động từ nhấn mạnh việc xảy ra muộn hơn mong đợi, ngược với 就: 他十点才起床 (mười giờ anh ấy mới dậy)."
examples = [
  { text = "他十点才起床。", translation = "Mười giờ anh ấy mới dậy." },
  { text = "我昨天才知道。", translation = "Hôm qua tôi mới biết." },
]
source = "gf0025-2021"
source_ref = "68"

[[grammar]]
key = "zh.hsk2.wang_xiang"
title = "往 và 向: hướng về"
pattern = "往/向 + phương hướng + động từ"
forms = ["往", "向"]
explanation = "往 và 向 chỉ hướng di chuyển, hay dùng khi chỉ đường: 往前走 (đi thẳng), 往左拐 (rẽ trái)."
examples = [
  { text = "一直往前走。", translation = "Cứ đi thẳng về phía trước." },
  { text = "到路口往左拐。", translation = "Đến ngã tư thì rẽ trái." },
]
source = "gf0025-2021"
source_ref = "70"

[[grammar]]
key = "zh.hsk2.dui"
title = "对: đối với"
pattern = "A + 对 + B + tính từ/động từ"
forms = ["对"]
explanation = "对 giới thiệu người hay vật mà hành động, thái độ hướng tới: 对我很好 (tốt với tôi), 对身体不好 (không tốt cho sức khỏe)."
examples = [
  { text = "抽烟对身体不好。", translation = "Hút thuốc không tốt cho sức khỏe." },
  { text = "老师对我们很好。", translation = "Thầy giáo rất tốt với chúng tôi." },
]
source = "gf0025-2021"
source_ref = "73"

[[grammar]]
key = "zh.hsk2.gei"
title = "给: cho, giúp, với"
pattern = "给 + người + động từ"
forms = ["给"]
explanation = "给 + người đứng trước động từ để nói hành động hướng tới ai hoặc làm giúp ai: 给妈妈打电话 (gọi điện cho mẹ)."
examples = [
  { text = "我晚上给你打电话。", translation = "Tối tôi gọi điện cho bạn." },
  { text = "他给我们介绍了一个朋友。", translation = "Anh ấy giới thiệu cho chúng tôi một người bạn." },
]
source = "gf0025-2021"
source_ref = "74"

[[grammar]]
key = "zh.hsk2.li_distance"
title = "离: cách (khoảng cách)"
pattern = "A + 离 + B + 远/近"
forms = ["离"]
explanation = "离 nói khoảng cách giữa hai nơi hoặc hai thời điểm: 我家离公司很近 (nhà tôi cách công ty rất gần)."
examples = [
  { text = "我家离学校很近。", translation = "Nhà tôi cách trường rất gần." },
  { text = "离考试还有三天。", translation = "Còn ba ngày nữa là thi." },
]
source = "gf0025-2021"
source_ref = "75"

[[grammar]]
key = "zh.hsk2.state_complement"
title = "Bổ ngữ trạng thái: 说得很好"
pattern = "động từ + 得 + tính từ / (động từ +) tân ngữ + động từ + 得 + tính từ"
forms = ["得"]
explanation = "得 nối động từ với lời đánh giá về cách làm: 他说得很快 (anh ấy nói rất nhanh). Có tân ngữ thì lặp lại động từ: 他说汉语说得很好."
examples = [
  { text = "你说得很好。", translation = "Bạn nói rất hay." },
  { text = "她跑得非常快。", translation = "Cô ấy chạy rất nhanh." },
]
source = "gf0025-2021"
source_ref = "99"

[[grammar]]
key = "zh.hsk2.guo_experience"
title = "过: đã từng"
pattern = "động từ + 过 / 没 + động từ + 过"
forms = ["过"]
explanation = "过 sau động từ nói trải nghiệm đã từng có. Phủ định là 没(有) + động từ + 过: 我没去过中国 (tôi chưa từng đến Trung Quốc)."
examples = [
  { text = "你吃过北京烤鸭吗？", translation = "Bạn đã từng ăn vịt quay Bắc Kinh chưa?" },
  { text = "我没去过中国。", translation = "Tôi chưa từng đến Trung Quốc." },
]
source = "gf0025-2021"
source_ref = "119"

[[grammar]]
key = "zh.hsk2.zhe_continuous"
title = "着: trạng thái kéo dài"
pattern = "động từ + 着"
forms = ["着"]
explanation = "着 sau động từ nói một trạng thái hoặc hành động đang kéo dài: 门开着 (cửa đang mở), 他笑着说 (anh ấy vừa cười vừa nói)."
examples = [
  { text = "门开着呢。", translation = "Cửa đang mở đấy." },
  { text = "墙上挂着一张地图。", translation = "Trên tường treo một tấm bản đồ." },
]
source = "gf0025-2021"
source_ref = "118"

[[grammar]]
key = "zh.hsk2.yuelaiyue"
title = "越来越: càng ngày càng"
pattern = "越来越 + tính từ / động từ tâm lý"
forms = ["越来越"]
explanation = "越来越 nói một sự thay đổi tăng dần theo thời gian: 天气越来越冷 (trời càng ngày càng lạnh)."
examples = [
  { text = "天气越来越冷了。", translation = "Trời càng ngày càng lạnh." },
  { text = "我越来越喜欢这个城市了。", translation = "Tôi càng ngày càng thích thành phố này." },
]
source = "gf0025-2021"
source_ref = "92"

[[grammar]]
key = "zh.hsk2.you_you"
title = "又……又……: vừa … vừa …"
pattern = "又 + tính từ/động từ + 又 + tính từ/động từ"
forms = ["又"]
explanation = "Nối hai đặc điểm cùng có một lúc: 又便宜又好吃 (vừa rẻ vừa ngon)."
examples = [
  { text = "这家饭馆的菜又便宜又好吃。", translation = "Món ăn quán này vừa rẻ vừa ngon." },
  { text = "她又聪明又漂亮。", translation = "Cô ấy vừa thông minh vừa xinh đẹp." },
]
source = "gf0025-2021"
source_ref = "94"

[[grammar]]
key = "zh.hsk2.yiqian_yihou"
title = "……以前 / ……以后: trước khi, sau khi"
pattern = "(在) + động từ/thời gian + 以前/以后"
forms = ["以前", "以后", "之前", "之后"]
explanation = "以前, 以后 đặt sau một việc hay thời điểm: 吃饭以前 (trước khi ăn), 下课以后 (sau khi tan học). Đứng một mình thì nghĩa là trước đây, sau này."
examples = [
  { text = "睡觉以前别喝咖啡。", translation = "Trước khi ngủ đừng uống cà phê." },
  { text = "下课以后我们去打球吧。", translation = "Tan học chúng mình đi chơi bóng nhé." },
]
source = "gf0025-2021"
source_ref = "95"

[[grammar]]
key = "zh.hsk2.result_complement"
title = "Bổ ngữ kết quả: 完, 好, 懂, 错"
pattern = "động từ + 完/好/懂/错/干净/清楚/会"
forms = ["完", "好", "懂", "错", "干净", "清楚", "会"]
explanation = "Thêm một từ chỉ kết quả ngay sau động từ: 做完 (làm xong), 听懂 (nghe hiểu), 写错 (viết sai). Phủ định dùng 没: 没听懂."
examples = [
  { text = "我听懂了。", translation = "Tôi nghe hiểu rồi." },
  { text = "作业你做完了吗？", translation = "Bài tập bạn làm xong chưa?" },
]
source = "gf0025-2021"
source_ref = "97"

[[grammar]]
key = "zh.hsk2.direction_complement"
title = "Bổ ngữ xu hướng: 来, 去, 上, 下"
pattern = "động từ + 来/去 / động từ + 上/下/进/出/回/过/起"
forms = ["来", "去", "上", "下", "进", "出", "回", "过", "起"]
explanation = "来 là hướng về phía người nói, 去 là rời xa người nói: 进来 (vào đây), 出去 (ra ngoài). 上, 下, 进, 出… chỉ hướng di chuyển."
examples = [
  { text = "请进来。", translation = "Mời vào." },
  { text = "他走出去了。", translation = "Anh ấy đã đi ra ngoài." },
]
source = "gf0025-2021"
source_ref = "98"

[[grammar]]
key = "zh.hsk2.comparison_2"
title = "So sánh: 比……更/还, 不如, 有……这么"
pattern = "A 比 B 更/还 + tính từ / A 不如 B / A 有 B 这么 + tính từ"
forms = ["比", "不如", "有"]
explanation = "A 比 B 更 (还) + tính từ là A còn … hơn B. A 不如 B là A không bằng B. A 有 B 这么… là A … bằng B (thường dùng trong câu hỏi, phủ định)."
examples = [
  { text = "今天比昨天还热。", translation = "Hôm nay còn nóng hơn hôm qua." },
  { text = "坐公交车不如坐地铁快。", translation = "Đi xe buýt không nhanh bằng đi tàu điện ngầm." },
]
source = "gf0025-2021"
source_ref = "106"

[[grammar]]
key = "zh.hsk2.gen_yiyang"
title = "跟……一样: giống như"
pattern = "A 跟 B 一样 (+ tính từ)"
forms = ["一样"]
explanation = "A 跟 B 一样 nói hai bên giống nhau; thêm tính từ để nói giống ở điểm nào: 我跟你一样高 (tôi cao bằng bạn). Phủ định: 不一样."
examples = [
  { text = "我的手机跟你的一样。", translation = "Điện thoại của tôi giống của bạn." },
  { text = "弟弟跟哥哥一样高。", translation = "Em trai cao bằng anh trai." },
]
source = "gf0025-2021"
source_ref = "107"

[[grammar]]
key = "zh.hsk2.shi_de"
title = "Câu 是……的: nhấn mạnh thời gian, nơi chốn, cách thức"
pattern = "(是) + thời gian/nơi chốn/cách thức + động từ + 的"
forms = ["是", "的"]
explanation = "Khi việc đã xảy ra và muốn nhấn mạnh làm lúc nào, ở đâu, bằng cách nào, với ai: 我是坐飞机来的 (tôi đến bằng máy bay)."
examples = [
  { text = "你是什么时候来的？", translation = "Bạn đến lúc nào vậy?" },
  { text = "我是坐飞机来的。", translation = "Tôi đến bằng máy bay." },
]
source = "gf0025-2021"
source_ref = "108"

[[grammar]]
key = "zh.hsk2.double_object"
title = "Câu hai tân ngữ: 给他一本书"
pattern = "động từ + người + vật (给/送/教/告诉/问)"
forms = ["给", "送", "教", "告诉", "问", "借", "还"]
explanation = "Một số động từ như 给, 送, 教, 告诉, 问 có hai tân ngữ: người đứng trước, vật đứng sau: 告诉你一件事 (kể bạn nghe một chuyện)."
examples = [
  { text = "我告诉你一个好消息。", translation = "Tôi báo cho bạn một tin vui." },
  { text = "王老师教我们汉语。", translation = "Thầy Vương dạy chúng tôi tiếng Trung." },
]
source = "gf0025-2021"
source_ref = "109"

[[grammar]]
key = "zh.hsk2.xian_zai"
title = "先……再/然后……: trước … rồi …"
pattern = "先 + động từ 1，再/然后 + động từ 2"
forms = ["先", "再", "然后"]
explanation = "Nói thứ tự các việc: 先 (trước), 再 hoặc 然后 (sau đó)."
examples = [
  { text = "我们先吃饭，再去看电影。", translation = "Chúng ta ăn cơm trước rồi đi xem phim." },
  { text = "先洗手，然后吃饭。", translation = "Rửa tay trước, rồi ăn cơm." },
]
source = "gf0025-2021"
source_ref = "110"

[[grammar]]
key = "zh.hsk2.budan_erqie"
title = "不但……而且……: không những … mà còn …"
pattern = "不但 + A，而且 + B"
forms = ["不但", "而且"]
explanation = "Nối hai ý theo mức tăng dần, ý sau mạnh hơn ý trước."
examples = [
  { text = "他不但会说汉语，而且说得很好。", translation = "Anh ấy không những biết nói tiếng Trung mà còn nói rất hay." },
  { text = "这儿不但便宜，而且很干净。", translation = "Chỗ này không những rẻ mà còn rất sạch." },
]
source = "gf0025-2021"
source_ref = "111"

[[grammar]]
key = "zh.hsk2.suiran_danshi"
title = "虽然……但是……: tuy … nhưng …"
pattern = "虽然 + A，但是/可是 + B / A，不过 + B"
forms = ["虽然", "但是", "可是", "不过", "但"]
explanation = "Nối hai ý trái ngược nhau. Khác tiếng Việt, tiếng Trung thường dùng cả cặp 虽然…但是… trong cùng câu."
examples = [
  { text = "虽然下雨了，但是他还是来了。", translation = "Tuy trời mưa nhưng anh ấy vẫn đến." },
  { text = "这件衣服很好看，不过有点儿贵。", translation = "Cái áo này rất đẹp, nhưng hơi đắt." },
]
source = "gf0025-2021"
source_ref = "113"

[[grammar]]
key = "zh.hsk2.ruguo_jiu"
title = "如果……就……: nếu … thì …"
pattern = "如果 + điều kiện，(chủ ngữ +) 就 + kết quả / ……的话"
forms = ["如果", "的话"]
explanation = "如果 nêu một giả định, 就 dẫn kết quả. Có thể dùng ……的话 ở cuối vế điều kiện thay hoặc kèm 如果."
examples = [
  { text = "如果明天下雨，我们就不去了。", translation = "Nếu mai trời mưa thì chúng ta không đi nữa." },
  { text = "你有时间的话，就来我家吧。", translation = "Nếu bạn có thời gian thì đến nhà tôi chơi nhé." },
]
source = "gf0025-2021"
source_ref = "114"

[[grammar]]
key = "zh.hsk2.zhiyao_jiu"
title = "只要……就……: chỉ cần … là …"
pattern = "只要 + điều kiện，就 + kết quả"
forms = ["只要"]
explanation = "只要 nêu một điều kiện đủ: chỉ cần có điều đó thì kết quả sẽ xảy ra."
examples = [
  { text = "只要努力，就能学好。", translation = "Chỉ cần cố gắng là sẽ học tốt." },
  { text = "只要你喜欢，就买吧。", translation = "Chỉ cần bạn thích thì mua đi." },
]
source = "gf0025-2021"
source_ref = "115"

[[grammar]]
key = "zh.hsk2.yinwei_suoyi"
title = "因为……所以……: vì … nên …"
pattern = "因为 + nguyên nhân，所以 + kết quả"
forms = ["因为", "所以"]
explanation = "Nối nguyên nhân và kết quả. Có thể dùng cả cặp hoặc chỉ một từ."
examples = [
  { text = "因为生病了，所以他没来上课。", translation = "Vì bị ốm nên anh ấy không đến lớp." },
  { text = "我很累，所以想早点儿睡。", translation = "Tôi rất mệt nên muốn ngủ sớm." },
]
source = "gf0025-2021"
source_ref = "116"

[[grammar]]
key = "zh.hsk2.yi_jiu"
title = "一……就……: hễ … là …, vừa … là …"
pattern = "一 + động từ 1，就 + động từ 2"
forms = ["一", "就"]
explanation = "Việc thứ hai xảy ra ngay sau việc thứ nhất, hoặc lần nào cũng xảy ra như vậy: 我一到家就给你打电话."
examples = [
  { text = "我一到家就给你打电话。", translation = "Tôi vừa về đến nhà là gọi cho bạn ngay." },
  { text = "他一喝酒就脸红。", translation = "Hễ uống rượu là mặt anh ấy đỏ." },
]
source = "gf0025-2021"
source_ref = "117"

[[grammar]]
key = "zh.hsk2.kuaiyao_le"
title = "要/快要/就要……了: sắp … rồi"
pattern = "(快)要 / 就要 + động từ + 了"
forms = ["快要", "就要", "快", "要"]
explanation = "Nói việc sắp xảy ra. 快要…了 và 快…了 là sắp; 就要…了 nhấn mạnh rất gần, có thể kèm thời gian cụ thể: 明天就要考试了."
examples = [
  { text = "火车快要开了。", translation = "Tàu sắp chạy rồi." },
  { text = "我们明天就要考试了。", translation = "Mai chúng tôi thi rồi." },
]
source = "gf0025-2021"
source_ref = "130"

[[grammar]]
key = "zh.hsk2.gai_le"
title = "该……了: đến lúc phải … rồi"
pattern = "该 + động từ/chủ ngữ + 了"
forms = ["该"]
explanation = "该…了 nói đã đến lúc làm việc gì: 该睡觉了 (đến giờ đi ngủ rồi), 该你了 (đến lượt bạn rồi)."
examples = [
  { text = "十一点了，该睡觉了。", translation = "Mười một giờ rồi, đến giờ đi ngủ thôi." },
  { text = "该你了。", translation = "Đến lượt bạn rồi." },
]
source = "gf0025-2021"
source_ref = "129"

[[grammar]]
key = "zh.hsk2.tag_questions"
title = "Hỏi ý kiến: ……好吗？/ 可以吗？/ 怎么样？"
pattern = "đề nghị + 好吗/可以吗/行吗/怎么样？"
forms = ["好吗", "可以吗", "行吗", "怎么样"]
explanation = "Thêm 好吗, 可以吗, 行吗, 怎么样 vào cuối một đề nghị để hỏi ý người nghe: 我们明天去，好吗？"
examples = [
  { text = "我们明天去，好吗？", translation = "Mai chúng ta đi nhé, được không?" },
  { text = "周末一起吃饭，怎么样？", translation = "Cuối tuần cùng ăn cơm nhé, thế nào?" },
]
source = "gf0025-2021"
source_ref = "124"

[[grammar]]
key = "zh.hsk2.ne_question"
title = "Câu hỏi rút gọn với 呢: còn … thì sao?"
pattern = "danh từ/đại từ + 呢？"
forms = ["呢"]
explanation = "Danh từ hoặc đại từ + 呢 hỏi lại cùng một câu hỏi về người hay vật khác: 我很好，你呢？ (còn bạn?). Đứng một mình còn hỏi \"ở đâu\": 我的手机呢？"
examples = [
  { text = "我是越南人，你呢？", translation = "Tôi là người Việt Nam, còn bạn?" },
  { text = "我的钥匙呢？", translation = "Chìa khóa của tôi đâu rồi?" },
]
source = "gf0025-2021"
source_ref = "126"

[[grammar]]
key = "zh.hsk2.serial_verbs"
title = "Câu liên động: 去商店买东西"
pattern = "chủ ngữ + 去/来 + nơi chốn + động từ"
forms = ["去", "来"]
explanation = "Hai động từ nối liền nhau theo thứ tự xảy ra: đi đâu rồi làm gì: 我去超市买水果 (tôi đi siêu thị mua hoa quả)."
examples = [
  { text = "我去超市买水果。", translation = "Tôi đi siêu thị mua hoa quả." },
  { text = "他来中国学习汉语。", translation = "Anh ấy đến Trung Quốc học tiếng Trung." },
]
source = "gf0025-2021"
source_ref = "105"

