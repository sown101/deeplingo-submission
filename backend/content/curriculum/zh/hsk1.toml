# --- Grammar -------------------------------------------------------------------------------

[[grammar]]
key = "zh.personal_pronouns"
title = "Đại từ nhân xưng: 我, 你, 您, 他, 她"
pattern = "我 / 你 / 您 / 他 / 她 (+ 们 = số nhiều)"
forms = ["我", "你", "您", "他", "她", "它", "我们", "你们", "他们", "她们"]
explanation = "我 là tôi, 你 là bạn, 您 là bạn nhưng lịch sự (dùng với người lớn tuổi), 他 là anh ấy, 她 là cô ấy. Thêm 们 để thành số nhiều: 我们 (chúng tôi), 他们 (họ)."
examples = [
  { text = "我是学生。", translation = "Tôi là học sinh." },
  { text = "您好！", translation = "Xin chào (lịch sự)!" },
]
source = "gf0025-2021"
source_ref = "5"

[[grammar]]
key = "zh.shi_sentence"
title = "Câu với 是: A 是 B"
pattern = "A + 是 + B / A + 不是 + B"
forms = ["是"]
explanation = "是 nghĩa là \"là\", nối hai danh từ: A là B. Phủ định thêm 不 phía trước: 不是. Không dùng 是 trước tính từ (nói 我很好, không nói 我是好)."
examples = [
  { text = "我是越南人。", translation = "Tôi là người Việt Nam." },
  { text = "他不是老师。", translation = "Anh ấy không phải là giáo viên." },
]
source = "gf0025-2021"
source_ref = "36"

[[grammar]]
key = "zh.ma_question"
title = "Câu hỏi có/không với 吗"
pattern = "câu trần thuật + 吗？"
forms = ["吗"]
explanation = "Thêm 吗 vào cuối câu là thành câu hỏi có/không, không cần đổi trật tự từ. Trả lời bằng cách lặp lại động từ: 是 / 不是."
examples = [
  { text = "你是中国人吗？", translation = "Bạn là người Trung Quốc phải không?" },
  { text = "你说汉语吗？", translation = "Bạn có nói tiếng Trung không?" },
]
source = "gf0025-2021"
source_ref = "45"

[[grammar]]
key = "zh.question_words"
title = "Câu hỏi với 哪, 什么, 谁"
pattern = "đặt từ hỏi vào đúng chỗ của thông tin cần hỏi"
forms = ["什么", "谁", "哪", "哪儿", "哪里", "怎么", "怎么样", "多少", "几"]
explanation = "Trong tiếng Trung, từ để hỏi đứng đúng vị trí của câu trả lời, không đưa lên đầu câu. 什么 là gì, 谁 là ai, 哪 là nào (哪国人: người nước nào)."
examples = [
  { text = "你是哪国人？", translation = "Bạn là người nước nào?" },
  { text = "他是谁？", translation = "Anh ấy là ai?" },
]
source = "gf0025-2021"
source_ref = "46"

[[grammar]]
key = "zh.you_sentence"
title = "Câu với 有: có"
pattern = "A + 有 + B / A + 没有 + B"
forms = ["有"]
explanation = "有 nghĩa là \"có\". Phủ định của 有 là 没有, không dùng 不有."
examples = [
  { text = "我有一个哥哥。", translation = "Tôi có một anh trai." },
  { text = "她没有妹妹。", translation = "Cô ấy không có em gái." },
]
source = "gf0025-2021"
source_ref = "37"

[[grammar]]
key = "zh.measure_words"
title = "Lượng từ: 个, 口, 本, 杯"
pattern = "số + lượng từ + danh từ"
forms = ["个", "口", "本", "杯", "块", "家", "间", "页"]
explanation = "Giữa số và danh từ luôn có một lượng từ, giống \"cái\", \"con\", \"quyển\" trong tiếng Việt. 个 dùng được với rất nhiều danh từ; 口 để đếm người trong gia đình; 本 cho sách; 杯 cho cốc."
examples = [
  { text = "我家有四口人。", translation = "Nhà tôi có bốn người." },
  { text = "一本书", translation = "một quyển sách" },
]
source = "gf0025-2021"
source_ref = "8"

[[grammar]]
key = "zh.numbers"
title = "Số đếm: 一 đến 十, 二 và 两"
pattern = "一 二 三 … 十; 两 + lượng từ"
forms = ["一", "二", "两", "三", "四", "五", "六", "七", "八", "九", "十", "零", "百", "半"]
explanation = "Học các số từ 一 đến 十, rồi ghép thành số lớn hơn: 十一 (11), 二十 (20). Khi đếm đồ vật đứng trước lượng từ, số 2 đọc là 两, không phải 二: 两个人."
examples = [
  { text = "我有两个弟弟。", translation = "Tôi có hai em trai." },
  { text = "二十一", translation = "hai mươi mốt" },
]
source = "gf0025-2021"
source_ref = "7"

[[grammar]]
key = "zh.ji_how_many"
title = "Hỏi số lượng và tuổi với 几"
pattern = "几 + lượng từ + danh từ？ / 你几岁？"
forms = ["几"]
explanation = "几 hỏi số lượng nhỏ, thường dưới mười, và luôn đi với lượng từ. Hỏi tuổi trẻ nhỏ dùng 你几岁？; hỏi người lớn thì dùng 多大."
examples = [
  { text = "你家有几口人？", translation = "Nhà bạn có mấy người?" },
  { text = "你女儿几岁？", translation = "Con gái bạn mấy tuổi?" },
]
source = "gf0025-2021"
source_ref = "4"

[[grammar]]
key = "zh.dates_times"
title = "Ngày, tháng, thứ và giờ"
pattern = "年 → 月 → 号 → 星期; số + 点"
forms = ["年", "月", "号", "日", "星期", "点", "分"]
explanation = "Tiếng Trung nói thời gian từ lớn đến nhỏ: năm, tháng, ngày, thứ. Thứ trong tuần là 星期 + số (星期一 là thứ Hai). Giờ là số + 点: 八点 (tám giờ)."
examples = [
  { text = "今天五月八号。", translation = "Hôm nay là ngày 8 tháng 5." },
  { text = "现在三点。", translation = "Bây giờ là ba giờ." },
]
source = "gf0025-2021"
source_ref = "44"

[[grammar]]
key = "zh.xiang_yao"
title = "想 và 要: muốn"
pattern = "chủ ngữ + 想/要 + động từ"
forms = ["想", "要"]
explanation = "想 + động từ là \"muốn làm gì\" (nhẹ nhàng), 要 + động từ là \"muốn, cần\" (chắc chắn hơn). Khi gọi món, 要 + món ăn là \"cho tôi …\"."
examples = [
  { text = "我想喝茶。", translation = "Tôi muốn uống trà." },
  { text = "我要米饭。", translation = "Cho tôi cơm." },
]
source = "gf0025-2021"
source_ref = "3"

[[grammar]]
key = "zh.affirmative_negative_question"
title = "Câu hỏi chính phản: 是不是, 好不好"
pattern = "động từ/tính từ + 不 + động từ/tính từ？"
forms = ["不"]
explanation = "Ghép dạng khẳng định và phủ định liền nhau để hỏi có/không, thay cho 吗. Câu này không thêm 吗 ở cuối."
examples = [
  { text = "你喝不喝水？", translation = "Bạn có uống nước không?" },
  { text = "这个菜好吃不好吃？", translation = "Món này có ngon không?" },
]
source = "gf0025-2021"
source_ref = "48"

[[grammar]]
key = "zh.zai_location"
title = "在: ở đâu"
pattern = "người/vật + 在 + nơi chốn"
forms = ["在"]
explanation = "在 + nơi chốn nghĩa là \"ở …\". Hỏi ở đâu: 在哪儿？"
examples = [
  { text = "妈妈在家。", translation = "Mẹ ở nhà." },
  { text = "学校在哪儿？", translation = "Trường học ở đâu?" },
]
source = "gf0025-2021"
source_ref = "16"

[[grammar]]
key = "zh.locality_nouns"
title = "Từ chỉ phương hướng: 里, 前边, 后边"
pattern = "nơi chốn + 里 / 前边 / 后边"
forms = ["上", "下", "里", "外", "前", "后", "左", "右"]
explanation = "Các từ chỉ phương hướng đứng sau danh từ, ngược với tiếng Việt: 学校前边 là phía trước trường học, 家里 là trong nhà."
examples = [
  { text = "商店在学校后边。", translation = "Cửa hàng ở phía sau trường học." },
  { text = "他在家里。", translation = "Anh ấy ở trong nhà." },
]
source = "gf0025-2021"
source_ref = "1"

[[grammar]]
key = "zh.money"
title = "Nói giá tiền: 块"
pattern = "số + 块 (钱)"
forms = ["块", "元", "毛", "钱"]
explanation = "Trong khẩu ngữ, đơn vị tiền là 块 (= 元). Hỏi giá: 多少钱？ Trả lời: 十块 hoặc 十块钱."
examples = [
  { text = "这个多少钱？", translation = "Cái này bao nhiêu tiền?" },
  { text = "二十块。", translation = "Hai mươi tệ." },
]
source = "gf0025-2021"
source_ref = "43"

[[grammar]]
key = "zh.demonstratives"
title = "这 và 那: này và kia"
pattern = "这/那 + (lượng từ) + danh từ"
forms = ["这", "那"]
explanation = "这 là \"này\" (gần), 那 là \"kia\" (xa). Trước danh từ thường cần lượng từ: 这个, 那件."
examples = [
  { text = "这是我的书。", translation = "Đây là sách của tôi." },
  { text = "那件衣服很贵。", translation = "Bộ quần áo kia rất đắt." },
]
source = "gf0025-2021"
source_ref = "6"

[[grammar]]
key = "zh.adjective_predicate"
title = "Câu tính từ: 天气很冷"
pattern = "chủ ngữ + 很/太 + tính từ"
forms = ["很", "太", "不", "非常", "真"]
explanation = "Tính từ làm vị ngữ trực tiếp, không cần 是. Thường thêm 很 phía trước, kể cả khi không muốn nhấn mạnh \"rất\"."
examples = [
  { text = "今天很热。", translation = "Hôm nay nóng." },
  { text = "天气不冷。", translation = "Thời tiết không lạnh." },
]
source = "gf0025-2021"
source_ref = "30"

[[grammar]]
key = "zh.degree_adverbs"
title = "Phó từ mức độ: 很, 太, 非常"
pattern = "很 / 非常 + tính từ; 太 + tính từ + 了"
forms = ["很", "太", "非常", "真", "最"]
explanation = "很 là rất (nhẹ), 非常 là vô cùng. 太 … 了 là \"quá …\", thường để than phiền hoặc khen."
examples = [
  { text = "太冷了！", translation = "Lạnh quá!" },
  { text = "这个菜非常好吃。", translation = "Món này vô cùng ngon." },
]
source = "gf0025-2021"
source_ref = "9"

[[grammar]]
key = "zh.hui_neng"
title = "会 và 能: biết, có thể"
pattern = "chủ ngữ + 会/能 + động từ"
forms = ["会", "能"]
explanation = "会 là biết làm gì nhờ học (会说汉语). 能 là có thể, đủ điều kiện để làm (今天能来). Phủ định thêm 不: 不会, 不能."
examples = [
  { text = "我会唱歌。", translation = "Tôi biết hát." },
  { text = "明天我不能去。", translation = "Ngày mai tôi không đi được." },
]
source = "gf0025-2021"
source_ref = "2"

[[grammar]]
key = "zh.progressive_zai"
title = "Đang làm gì: 在 + động từ"
pattern = "chủ ngữ + 在/正在 + động từ (+ 呢)"
forms = ["在", "正在", "正", "呢"]
explanation = "Đặt 在 hoặc 正在 trước động từ để nói việc đang diễn ra, có thể thêm 呢 ở cuối."
examples = [
  { text = "我在看书。", translation = "Tôi đang đọc sách." },
  { text = "他们在看电影呢。", translation = "Họ đang xem phim." },
]
source = "gf0025-2021"
source_ref = "42"

